name: Build the library's semantic vectors

run-name: library-vectors ${{ inputs.release_tag || github.event.workflow_run.display_title }}

# The semantic vectors of a library release, built on the machine that holds the warehouse
# and the GPU, once the release's search index is stored (build-library-index.yml), and
# published beside the release, one release per family (FAMILY_CONFIGS in pins.env):
# vectors-<tag>, which released applications install, then vectors-windows-<tag>, and in mode auto
# vectors-windows-delta-<tag> beside it when the chain it extends allows. Everything happens in
# .github/scripts/vectors/build_library_vectors.sh, which runs by hand on that machine the
# same way, after bootstrap_runner.sh; this file only decides when, where, and in which mode.
#
# Nothing is published, and a dry run fails too, unless the release passes two sets of gates:
# the sidecar's assemble --verify, and the plugin's validate_semantic_vectors on the release
# index (G3 coverage, G4 resolution, G6 retrieval with the int8 query model). Both reports,
# gates.json and validation.json, are published with the release.
#
# Publishing is opt-in: a run the index workflow triggers is a dry run unless the repository
# variable LIBRARY_VECTORS_PUBLISH is "true", and then mode auto; a manual run says so with `mode`. What it
# publishes is a prerelease unless the repository variable LIBRARY_VECTORS_PRERELEASE is
# "false": a prerelease stays out of update-release-manifest.yml and the database history.

on:
  workflow_run:
    workflows: ["Build and store the library search index"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Library release tag (v<dbVersion>-<utcTimestamp>)'
        type: string
        required: true
      mode:
        description: 'auto: base, and a delta where the chain allows; base: build, verify and publish each family''s base; dry-run: build and verify only, reporting G6 recall in the job summary (one family alone measures a new codec)'
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - auto
          - base
      family:
        description: 'The families to build: all, or one alone (a retry, or a first build that fills the warehouse)'
        type: choice
        required: true
        default: all
        options:
          - all
          - meivin-round2-onnx
          - meivin-round2-windows-onnx

permissions:
  contents: write

# One build at a time, never cancelled: the warehouse and the ledger are shared state, and a
# run already embedding holds GPU work a newer trigger would throw away.
concurrency:
  group: seforim-library-vectors
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    name: Accept only a stored index of a database release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.classify.outputs.proceed }}
      release_tag: ${{ steps.classify.outputs.release_tag }}
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Classify the trigger
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_MODE: ${{ inputs.mode }}
          PUBLISH: ${{ vars.LIBRARY_VECTORS_PUBLISH }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            TAG=$INPUT_TAG; MODE=$INPUT_MODE
            if ! echo "$TAG" | grep -Eq '^v[0-9]+-[0-9]{14}$'; then
              echo "::error::release_tag '$TAG' is not a database release tag (v<dbVersion>-<utcTimestamp>)"
              exit 1
            fi
          else
            if [ "$RUN_CONCLUSION" != success ]; then
              echo "The index build concluded '$RUN_CONCLUSION' — no vectors without a stored index."
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            TAG=${RUN_TITLE#library-index }
            if ! echo "$TAG" | grep -Eq '^v[0-9]+-[0-9]{14}$'; then
              echo "The index run '$RUN_TITLE' names no database release — nothing to embed."
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            MODE=dry-run
            [ "$PUBLISH" != true ] || MODE=auto
            # An index rebuilt for a release (a new engine schema) fires this again; its vectors stay.
            if [ "$MODE" != dry-run ]; then
              FAMILIES=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/vectors/pins.env?ref=$GITHUB_SHA" \
                -H "Accept: application/vnd.github.raw" | sed -n 's/^FAMILY_CONFIGS="\([^"]*\)".*/\1/p')
              [ -n "$FAMILIES" ] || { echo "::error::pins.env at $GITHUB_SHA names no FAMILY_CONFIGS"; exit 1; }
              FIRST=${FAMILIES%% *}; FIRST=${FIRST#*:}; FIRST=${FIRST%%:*}   # <dir>:<prefix>[:<codec>]
              # A draft a failed publish left goes on to the driver, which says how to retry it.
              if [ "$(gh release view "$FIRST-$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
                INCOMPLETE=""
                for family in $FAMILIES; do
                  family_prefix=${family#*:}
                  family_tag="${family_prefix%%:*}-$TAG"
                  family_draft=$(gh release view "$family_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) || family_draft=missing
                  if [ "$family_draft" = true ]; then
                    INCOMPLETE="$INCOMPLETE $family_tag (draft)"
                  elif [ "$family_draft" != false ]; then
                    INCOMPLETE="$INCOMPLETE $family_tag (missing)"
                  fi
                  # A delta is best-effort: missing is normal, a draft is one a failed publish left
                  delta_tag="${family_prefix%%:*}-delta-$TAG"
                  if [ "$(gh release view "$delta_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
                    INCOMPLETE="$INCOMPLETE $delta_tag (draft)"
                  fi
                done
                echo "::notice::$FIRST-$TAG is published already, so this index rebuild embeds nothing.${INCOMPLETE:+ Incomplete:$INCOMPLETE — delete any draft, then dispatch this workflow with the affected family to build it.}"
                echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
          fi
          echo "Release $TAG, mode $MODE."
          {
            echo "proceed=true"
            echo "release_tag=$TAG"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

  vectors:
    name: Embed, assemble, verify, validate and publish the vectors
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    # The build machine: the label the index workflow's local runner carries, and its GPU.
    runs-on: [self-hosted, otzaria-db, amd-gpu]
    # On a runner with no warehouse yet, the first build plans and embeds the whole library
    # on the GPU (~1 h), plus the index and the assembly, and its first add creates the
    # warehouse; a later release embeds only the texts the warehouse lacks, on the CPU when
    # they are few (CPU_EMBED_MAX in pins.env). The windows family's first build embeds ~3.2M
    # texts (about an hour more); if it ever outlasts this bound, a dry run of it alone fills the warehouse.
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
      OTZARIA_HF_TOKEN: ${{ secrets.OTZARIA_HF_TOKEN }}
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
      MODE: ${{ needs.gate.outputs.mode }}
      FAMILY: ${{ inputs.family }}
      LIBRARY_VECTORS_PRERELEASE: ${{ vars.LIBRARY_VECTORS_PRERELEASE || 'true' }}
    steps:
      # The build machine's other self-hosted jobs pin checkout@v4: its runner's Node 24
      # support is not proven (test_ci_workflows.SELF_HOSTED_JOBS).
      - name: Checkout SeforimLibrary
        uses: actions/checkout@v4

      # Brings the machine to pins.env: rebuilds only what a changed pin left stale, else a no-op.
      # The runner service does not source ~/.cargo/env, so cargo is put on PATH here.
      - name: Bring the build machine to the pins
        run: |
          [ ! -d "$HOME/.cargo/bin" ] || export PATH="$HOME/.cargo/bin:$PATH"
          bash .github/scripts/vectors/bootstrap_runner.sh

      - name: Build the vectors
        run: bash .github/scripts/vectors/build_library_vectors.sh --tag "$RELEASE_TAG" --mode "$MODE" --family "${FAMILY:-all}" --repo "$GITHUB_REPOSITORY"
