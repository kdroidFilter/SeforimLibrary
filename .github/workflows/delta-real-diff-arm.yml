name: Delta pipeline — real diff test (ARM)

# delta-real-diff-test.yml on the 16 GB ARM runner.
#
# This file used to be a byte-for-byte copy of that workflow apart from its
# name — same `runs-on: [self-hosted, Linux, ARM64]` and all — so there was
# never a reason to dispatch it, and it never ran once. It now calls the same
# workflow with runner_selection=ARM64, so the two cannot drift apart again.
#
# The ARM runner has no durable Java/Gradle installation, so this route is the
# one that still sets the toolchain up through actions/setup-java. Prefer the
# `local` runner in delta-real-diff-test.yml; use this one when that host is
# busy with a release.

on:
  workflow_dispatch:
    inputs:
      inputs_from:
        # 'released' needs a ForDB archive with the schema-7 notice and override files
        # (divine_name_overrides.csv is required): use 'latest' until v33 is out.
        description: 'Which snapshot both builds see (use latest until v33 is released)'
        required: true
        default: 'released'
        type: choice
        options:
          - 'released'
          - 'latest'
      baseline_ref:
        description: >-
          Commit/ref to build v1 from. Empty (default) = this tree on both
          sides. See delta-real-diff-test.yml for what each mode measures.
        required: false
        type: string
        default: ''

permissions:
  contents: read

# The concurrency group lives on delta-real-diff-test.yml, the workflow this one
# calls: a caller that held the same group would be waiting on its own job.

jobs:
  real-diff:
    uses: ./.github/workflows/delta-real-diff-test.yml
    with:
      runner_selection: ARM64
      inputs_from: ${{ inputs.inputs_from }}
      baseline_ref: ${{ inputs.baseline_ref }}
