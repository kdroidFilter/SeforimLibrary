name: Weekly 5–6/6 · Build, link, validate and publish Seforim DB
run-name: manual-generate-release correlation=${{ inputs.correlation_id }}

# End-to-end build pipeline: builds seforim.db from immutable, digest-pinned
# Sefaria + Otzaria releases, runs the LinkerToOtzaria relink against this
# build's own lines snapshot and injects the resulting LINKER links, then
# packages a split bundle and publishes the lot as a final GitHub release.
# Serial by design: the release always ships a complete link set; a linker
# failure fails the build loudly (requires the PIPELINE_TOKEN secret).
#
# From the second release onwards, the workflow produces a logarithmic
# fan of delta patches against previous releases at fixed offsets
# {1, 2, 4, 8, 16}. A client on any version k within those offsets can
# fetch a *direct* patch; clients further back chain through the
# available anchors. The full bundle remains the fallback.
#
# Anchors auto-discovered from prior release assets — no manual
# operator input needed. db_version is derived as max(prior versions)+1.

on:
  workflow_dispatch:
    inputs:
      runner_selection:
        description: 'בחר על איזה שרת להריץ את הבנייה'
        required: true
        default: 'local'
        type: choice
        options:
          - 'local'
          - 'ARM64'
          - 'server-2'
      prerelease:
        description: |
          Publish as a GitHub pre-release (true) or a final release
          (false, default). Weekly database builds are final releases;
          use true only for an explicitly experimental manual build.
        type: boolean
        required: false
        default: false
      source_commit:
        description: 'Full SeforimLibrary commit selected by the manual-links sync'
        type: string
        required: true
      sefaria_tag:
        description: 'Immutable SefariaExport release tag'
        type: string
        required: true
      sefaria_release_metadata_sha256:
        description: 'Raw SHA-256 of release_metadata.json'
        type: string
        required: true
      sefaria_archive_sha256:
        description: 'SHA-256 of the complete Sefaria archive stream'
        type: string
        required: true
      otzaria_tag:
        description: 'Immutable otzaria-library release tag'
        type: string
        required: true
      otzaria_asset_sha256:
        description: 'Raw SHA-256 of the Otzaria ZIP asset'
        type: string
        required: true
      fordb_archive_sha256:
        description: 'SHA-256 of the pinned ForDB rules archive (fordb_latest.zip)'
        type: string
        required: true
      fordb_tag:
        description: 'Immutable content-addressed ForDB release tag'
        type: string
        required: true
      saga_run_id:
        description: 'Origin sync-manual-links run for event-driven callback (empty for manual use)'
        type: string
        required: false
        default: ''
      saga_run_attempt:
        description: 'Exact attempt of the origin sync-manual-links run (paired with saga_run_id)'
        type: string
        required: false
        default: ''
      expected_links_commit:
        description: 'otzaria-library commit containing refreshed links'
        type: string
        required: true
      otzaria_target_commit:
        description: 'Commit the Otzaria release tag must target'
        type: string
        required: true
      correlation_id:
        description: 'Exact parent pipeline correlation id'
        type: string
        required: true
      relink_recovery_run_id:
        description: |
          Optional exact successful LinkerToOtzaria relink recovery run. When set,
          rebuild the DB from the pinned inputs but consume this run instead of
          dispatching another GPU session. The run, its failed parent, request id,
          snapshot digest, commit, attempt and artifacts are all verified fail-closed.
        type: string
        required: false
        default: ''

permissions:
  contents: write

# Only one release build at a time. A RAM-backed build dir (see the tmpfs step)
# makes two concurrent runs on the same self-hosted host a memory hazard, and a
# release pipeline should never race itself. Queue rather than cancel — a build
# in flight is expensive (hours) and must not be killed mid-way; queue:max lifts
# GitHub's single-pending slot to a durable queue so a later dispatch can't supersede
# a pending build. (queue:max shipped 2026-05-07; confirm at canary — no lint gate here.)
concurrency:
  group: seforim-manual-release
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    name: Reuse a complete build with identical pinned inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
      release_tag: ${{ steps.lookup.outputs.release_tag }}
      build_provenance_sha256: ${{ steps.lookup.outputs.build_provenance_sha256 }}
      lineage_sha256: ${{ steps.lookup.outputs.lineage_sha256 }}
      config_sha256: ${{ steps.lookup.outputs.config_sha256 }}
      source_links_tree_sha256: ${{ steps.lookup.outputs.source_links_tree_sha256 }}
      packaged_links_tree_sha256: ${{ steps.lookup.outputs.packaged_links_tree_sha256 }}
      assets_json: ${{ steps.lookup.outputs.assets_json }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Reconciliation is control-plane work.  It must use the validator
          # shipped with this workflow run, not the older payload commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      # unittest writes its "Ran N tests" / "OK" summary to stderr and the step
      # then reports a bare green check: run 34024655297 carries no test count
      # anywhere in 28,118 lines. Each suite now ends in one explicit line, and
      # a suite that collects nothing (a rename, a lost import, an empty file)
      # fails the step instead of passing in silence. The first five keep their
      # order and the fail-closed behaviour of the `&&` chain this replaces.
      #
      # The last three ran nowhere until now: test_ci_workflows (the hosted
      # ci/contract invariants), test_patch_anchor_schema (the fan's cheap
      # UNPATCHABLE/PROCEED pre-check) and test_prefetch_patch_anchors (the
      # prefetch script's cold fetch, digest-verified cache, eviction and abort
      # paths). The patch fan's own anchor machinery therefore shipped ungated.
      # All three are hermetic on ubuntu-latest — the sandbox prepends stub
      # `gh`/`java`/`sqlite3` binaries to PATH and an unexpected invocation
      # exits 90 instead of reaching the network, no credentials and no
      # `setsid` are needed, and the anchors are 200 KB of filler instead of
      # 1.3 GB — and they run here, in the first and cheapest job, so a
      # regression stops the pipeline before it books the self-hosted runner.
      # test_prefetch_patch_anchors is last because it is the slow one (~1 min).
      # test_library_index_workflow joined them when the search index moved out
      # of the application's release build and onto the database release: it
      # pins that build-library-index.yml can never run before the release it
      # indexes, and that the bundled Talmud volumes stay IN the catalogue the
      # index is built from — they are never indexed, but catalogue order is a
      # position in the whole tree and drifts silently without them.
      - name: Validate local orchestration boundary contracts
        run: |
          set -euo pipefail
          total=0
          for suite in \
            test_build_provenance \
            test_otzaria_provenance \
            test_host_safety \
            test_manual_release_workflow \
            test_verify_relink_recovery_snapshot \
            test_ci_workflows \
            test_patch_anchor_schema \
            test_library_index_workflow \
            test_prefetch_patch_anchors \
            test_split_full_db; do
            log="$RUNNER_TEMP/$suite.log"
            if ! python3 ".github/scripts/$suite.py" > "$log" 2>&1; then
              cat "$log"
              echo "::error::$suite failed — see its output above"
              exit 1
            fi
            ran=$(sed -n 's/^Ran \([0-9][0-9]*\) test.*/\1/p' "$log" | tail -n1)
            skipped=$(sed -n 's/^OK (skipped=\([0-9][0-9]*\)).*/\1/p' "$log" | tail -n1)
            if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
              cat "$log"
              echo "::error::$suite reported no tests — it collected nothing"
              exit 1
            fi
            passed=$((ran - ${skipped:-0}))
            echo "tests: $suite $passed passed${skipped:+ ($skipped skipped)}"
            total=$((total + passed))
          done
          echo "tests: local orchestration boundary contracts $total passed"
      - name: Validate the complete immutable dispatch contract
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SAGA_RUN_ID: ${{ inputs.saga_run_id }}
          SAGA_RUN_ATTEMPT: ${{ inputs.saga_run_attempt }}
          RELINK_RECOVERY_RUN_ID: ${{ inputs.relink_recovery_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEFARIA_TAG" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$SEFARIA_METADATA_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SEFARIA_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OTZARIA_TAG" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$OTZARIA_ASSET_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FORDB_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FORDB_TAG" == "fordb-sha256-$FORDB_ARCHIVE_SHA" ]]
          [[ "$EXPECTED_LINKS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OTZARIA_TARGET_COMMIT" == "$EXPECTED_LINKS_COMMIT" ]]
          [[ "$CORRELATION_ID" =~ ^sefaria:([1-9][0-9]*):([1-9][0-9]*):([A-Za-z0-9._-]{1,100}):([0-9a-f]{64})$ ]]
          [[ "${BASH_REMATCH[3]}" == "$SEFARIA_TAG" ]]
          [[ "${BASH_REMATCH[4]}" == "$SEFARIA_METADATA_SHA" ]]
          [[ -z "$RELINK_RECOVERY_RUN_ID" || "$RELINK_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [[ -n "$SAGA_RUN_ID" || -n "$SAGA_RUN_ATTEMPT" ]]; then
            [[ "$SAGA_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$SAGA_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          fi
      - name: Find and verify exact provenance
        id: lookup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
          PHASE2_IMPLEMENTATION_COMMIT: ${{ inputs.relink_recovery_run_id != '' && github.sha || inputs.source_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provenance-scan"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add' > "$RUNNER_TEMP/releases.json"
          MATCHES=0
          SCANNED_PROVENANCE=0
          MATCH_TAG=""
          MATCH_SHA=""
          MATCH_CONFIG_SHA=""
          MATCH_LINEAGE_SHA=""
          MATCH_SOURCE_TREE_SHA=""
          MATCH_PACKAGED_TREE_SHA=""
          MATCH_ASSETS=""
          while IFS=$'\t' read -r release_id tag draft target provenance_id; do
            if [ "$draft" = true ] && [ "$target" = "$SOURCE_COMMIT" ]; then
              echo "::error::Draft/partial release $tag already targets this source commit; recovery requires completing or deleting that draft explicitly."
              exit 1
            fi
            [ "$provenance_id" != "NONE" ] || continue
            file="$RUNNER_TEMP/provenance-scan/$release_id.json"
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$provenance_id" > "$file"
            # Releases created before the current provenance contract can carry a
            # legacy build_provenance.json.  They cannot prove reuse for these
            # pinned inputs, so ignore them; a malformed provenance for this
            # exact source commit remains a hard failure rather than risking a
            # duplicate or partial release.
            if ! python3 .github/scripts/validate_build_provenance.py --quiet "$file"; then
              if [ "$target" = "$SOURCE_COMMIT" ]; then
                echo "::error::Release $tag targets this source commit but has invalid build provenance; recover or remove it explicitly."
                exit 1
              fi
              echo "::warning::Skipping legacy release $tag with invalid build provenance"
              continue
            fi
            SCANNED_PROVENANCE=$((SCANNED_PROVENANCE+1))
            if jq -e \
              --arg source "$SOURCE_COMMIT" \
              --arg st "$SEFARIA_TAG" --arg sm "$SEFARIA_METADATA_SHA" --arg sa "$SEFARIA_ARCHIVE_SHA" \
              --arg ot "$OTZARIA_TAG" --arg oa "$OTZARIA_ASSET_SHA" \
              --arg ec "$EXPECTED_LINKS_COMMIT" --arg tc "$OTZARIA_TARGET_COMMIT" \
              --arg fd "$FORDB_ARCHIVE_SHA" --arg ft "$FORDB_TAG" \
              --arg phase2 "$PHASE2_IMPLEMENTATION_COMMIT" \
              '.source_commit==$source and .sefaria_tag==$st and .sefaria_release_metadata_sha256==$sm and
               .sefaria_archive_sha256==$sa and .otzaria_tag==$ot and .otzaria_asset_sha256==$oa and
               .expected_links_commit==$ec and .otzaria_target_commit==$tc and
               .fordb_archive_sha256==$fd and .fordb_tag==$ft and
               .phase2_implementation_commit==$phase2' "$file" >/dev/null; then
              test "$draft" = false
              test "$target" = "$SOURCE_COMMIT"
              [[ "$tag" =~ ^v[1-9][0-9]*-[0-9]{14}$ ]]
              encoded_tag="$(jq -rn --arg value "$tag" '$value|@uri')"
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded_tag" --jq .object.sha)" = "$SOURCE_COMMIT"
              # GitHub exposes sha256 digests for uploaded release assets. Every
              # payload declared by provenance must exist exactly once and match.
              while IFS=$'\t' read -r name size sha; do
                COUNT=$(jq --argjson id "$release_id" --arg name "$name" '[.[]|select(.id==$id)|.assets[]|select(.name==$name)]|length' "$RUNNER_TEMP/releases.json")
                test "$COUNT" -eq 1
                REMOTE_SIZE=$(jq -r --argjson id "$release_id" --arg name "$name" '.[]|select(.id==$id)|.assets[]|select(.name==$name)|.size' "$RUNNER_TEMP/releases.json")
                REMOTE_DIGEST=$(jq -r --argjson id "$release_id" --arg name "$name" '.[]|select(.id==$id)|.assets[]|select(.name==$name)|.digest' "$RUNNER_TEMP/releases.json")
                test "$REMOTE_SIZE" = "$size"
                test "$REMOTE_DIGEST" = "sha256:$sha"
              done < <(jq -r '.assets[]|[.name,(.size|tostring),.sha256]|@tsv' "$file")
              PROVENANCE_SIZE=$(stat -c %s "$file")
              PROVENANCE_SHA=$(sha256sum "$file" | cut -d' ' -f1)
              REMOTE_PROVENANCE_SIZE=$(jq -r --argjson id "$release_id" '.[]|select(.id==$id)|.assets[]|select(.name=="build_provenance.json")|.size' "$RUNNER_TEMP/releases.json")
              REMOTE_PROVENANCE_DIGEST=$(jq -r --argjson id "$release_id" '.[]|select(.id==$id)|.assets[]|select(.name=="build_provenance.json")|.digest' "$RUNNER_TEMP/releases.json")
              test "$REMOTE_PROVENANCE_SIZE" = "$PROVENANCE_SIZE"
              test "$REMOTE_PROVENANCE_DIGEST" = "sha256:$PROVENANCE_SHA"
              REMOTE_ASSET_COUNT=$(jq --argjson id "$release_id" '.[]|select(.id==$id)|.assets|length' "$RUNNER_TEMP/releases.json")
              EXPECTED_ASSET_COUNT=$(jq '.assets|length + 1' "$file")
              test "$REMOTE_ASSET_COUNT" -eq "$EXPECTED_ASSET_COUNT"
              MATCHES=$((MATCHES+1))
              MATCH_TAG="$tag"
              MATCH_SHA="$PROVENANCE_SHA"
              MATCH_CONFIG_SHA=$(jq -r .config_sha256 "$file")
              MATCH_LINEAGE_SHA=$(jq -r .lineage_sha256 "$file")
              MATCH_SOURCE_TREE_SHA=$(jq -r .source_links_tree_sha256 "$file")
              MATCH_PACKAGED_TREE_SHA=$(jq -r .packaged_links_tree_sha256 "$file")
              MATCH_ASSETS=$(jq -cS \
                --arg name build_provenance.json --argjson size "$PROVENANCE_SIZE" --arg sha "$PROVENANCE_SHA" \
                '.assets + [{name:$name,size:$size,sha256:$sha}] | sort_by(.name)' "$file")
            fi
          done < <(jq -r '.[] | [.id,.tag_name,.draft,.target_commitish,([.assets[]|select(.name=="build_provenance.json")|.id][0]//"NONE")] | @tsv' "$RUNNER_TEMP/releases.json")
          # One line for the whole reuse scan instead of one per release: the
          # validator is run --quiet here precisely because ~27 identical ok:
          # lines would bury the two verdicts that matter (this count and reuse=).
          echo "ok: build_provenance checked on $SCANNED_PROVENANCE releases"
          test "$MATCHES" -le 1 || { echo "::error::Multiple complete releases have identical input provenance"; exit 1; }
          if [ "$MATCHES" -eq 1 ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$MATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "build_provenance_sha256=$MATCH_SHA" >> "$GITHUB_OUTPUT"
            echo "lineage_sha256=$MATCH_LINEAGE_SHA" >> "$GITHUB_OUTPUT"
            echo "config_sha256=$MATCH_CONFIG_SHA" >> "$GITHUB_OUTPUT"
            echo "source_links_tree_sha256=$MATCH_SOURCE_TREE_SHA" >> "$GITHUB_OUTPUT"
            echo "packaged_links_tree_sha256=$MATCH_PACKAGED_TREE_SHA" >> "$GITHUB_OUTPUT"
            echo "assets_json=$MATCH_ASSETS" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      # Fail fast on the recovery inputs, before a runner is even leased.
      # Build 34021998271 burned 48 minutes — 35 min of DB generation, a
      # snapshot dump and a 987 MiB upload — and then died in "Apply LINKER
      # links (Phase-2)" on the Linker's meta.json schema. Every byte that
      # check needs already existed at second 0: relink_recovery_run_id is a
      # dispatch input and the recovery relink had finished 37 s earlier.
      #
      # So resolve the same payload Phase-2 will consume and run the SAME
      # verifier code on its meta.json (--preflight); the accepted schema set
      # lives in one constant that both paths read, so the cheap gate cannot
      # drift from the expensive one. Everything here is input-only — nothing
      # depends on the rebuilt DB.
      #
      # Additive by construction: the authoritative "exact terminal recovery
      # attempt" guard in "Run LinkerToOtzaria relink on this snapshot (and
      # wait)" and every Phase-2 check are unchanged and still run against the
      # real payload. This step only refuses earlier, and only for inputs those
      # checks would refuse anyway. Skipped when the reconciler already found a
      # complete release for these pinned inputs: that build never runs, so its
      # recovery inputs decide nothing.
      - name: Preflight the recovery relink inputs
        if: inputs.relink_recovery_run_id != '' && steps.lookup.outputs.reuse != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          RECOVERY_RUN_ID: ${{ inputs.relink_recovery_run_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::recovery preflight: PIPELINE_TOKEN is empty or missing — cannot read Otzaria/LinkerToOtzaria"; exit 1; }
          WORK="$RUNNER_TEMP/recovery-preflight"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          gh api "repos/Otzaria/LinkerToOtzaria/actions/runs/$RECOVERY_RUN_ID" > "$WORK/run.json" || {
            echo "::error::recovery preflight: relink_recovery_run_id $RECOVERY_RUN_ID is not a readable Otzaria/LinkerToOtzaria run"; exit 1; }
          # map(. // "none"): bash treats tab as IFS *whitespace*, so consecutive
          # tabs collapse and an empty column (a still-running run has
          # conclusion=null) would shift every later field left and misreport the
          # value seen. The || arm keeps a jq failure from exiting bare.
          IFS=$'\t' read -r RUN_STATUS RUN_CONCLUSION RUN_ATTEMPT RUN_HEAD RUN_TITLE < <(jq -er \
            '[.status, .conclusion, (.run_attempt|tostring), .head_sha, .display_title]
             | map(. // "none") | @tsv' "$WORK/run.json") || {
            echo "::error::recovery preflight: run $RECOVERY_RUN_ID API response is not a run object with status, conclusion, run_attempt, head_sha and display_title"; exit 1; }
          [ "$RUN_STATUS" = completed ] && [ "$RUN_CONCLUSION" = success ] || {
            echo "::error::recovery preflight: run $RECOVERY_RUN_ID is $RUN_STATUS:$RUN_CONCLUSION, expected completed:success"; exit 1; }
          if [[ "$RUN_TITLE" =~ ^relink-recovery\ request=([0-9a-f]{64})\ parent=([1-9][0-9]*):([1-9][0-9]*)$ ]]; then
            REQUEST_ID="${BASH_REMATCH[1]}"
            PARENT_RUN_ID="${BASH_REMATCH[2]}"
            PARENT_RUN_ATTEMPT="${BASH_REMATCH[3]}"
          else
            echo "::error::recovery preflight: run $RECOVERY_RUN_ID display_title is '$RUN_TITLE', expected 'relink-recovery request=<64 hex> parent=<run>:<attempt>'"; exit 1
          fi
          # Correlation binding only. The terminal-state, event, path and attempt
          # assertions on the parent stay in the build job's guard.
          PARENT_TITLE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/attempts/$PARENT_RUN_ATTEMPT" --jq .display_title)" || {
            echo "::error::recovery preflight: run $RECOVERY_RUN_ID names parent $PARENT_RUN_ID:$PARENT_RUN_ATTEMPT, which is not a readable run of this repository"; exit 1; }
          [ "$PARENT_TITLE" = "manual-generate-release correlation=$CORRELATION_ID" ] || {
            echo "::error::recovery preflight: parent $PARENT_RUN_ID:$PARENT_RUN_ATTEMPT display_title is '$PARENT_TITLE', expected 'manual-generate-release correlation=$CORRELATION_ID'"; exit 1; }
          gh release download "linker-output-$REQUEST_ID-$RUN_ATTEMPT" -R Otzaria/LinkerToOtzaria \
            -p linker_release_pointer.json -p relink_manifest.json -D "$WORK" || {
            echo "::error::recovery preflight: release linker-output-$REQUEST_ID-$RUN_ATTEMPT of Otzaria/LinkerToOtzaria has no readable linker_release_pointer.json + relink_manifest.json"; exit 1; }
          WORK="$WORK" RECOVERY_RUN_ID="$RECOVERY_RUN_ID" RUN_ATTEMPT="$RUN_ATTEMPT" RUN_HEAD="$RUN_HEAD" \
          REQUEST_ID="$REQUEST_ID" PARENT_RUN_ID="$PARENT_RUN_ID" PARENT_RUN_ATTEMPT="$PARENT_RUN_ATTEMPT" \
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          work = Path(os.environ["WORK"])
          def fail(message):
              print(f"::error::recovery preflight: {message}", flush=True)
              raise SystemExit(1)
          def load(name):
              try:
                  return json.loads((work / name).read_text(encoding="utf-8"))
              except ValueError as error:
                  fail(f"{name} is not valid JSON ({error})")
          manifest, pointer = load("relink_manifest.json"), load("linker_release_pointer.json")
          def check(name, document, field, expected):
              if document.get(field) != expected:
                  fail(f"{name} field {field} is {document.get(field)!r}, expected {expected!r}")
          def hex64(name, document, field):
              value = document.get(field)
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{64}", value):
                  fail(f"{name} field {field} is {value!r}, expected a 64-character lowercase sha256")
              return value
          run, attempt = int(os.environ["RECOVERY_RUN_ID"]), int(os.environ["RUN_ATTEMPT"])
          request, head = os.environ["REQUEST_ID"], os.environ["RUN_HEAD"]
          for field, expected in (("schema_version", 2), ("relink_request_id", request),
                                  ("relink_run_id", run), ("relink_run_attempt", attempt),
                                  ("parent_run_id", int(os.environ["PARENT_RUN_ID"])),
                                  ("parent_run_attempt", int(os.environ["PARENT_RUN_ATTEMPT"])),
                                  ("linker_commit", head)):
              check("relink_manifest.json", manifest, field, expected)
          for field, expected in (("schema_version", 1), ("relink_request_id", request),
                                  ("relink_run_id", run), ("relink_run_attempt", attempt),
                                  ("payload_sha256", hex64("relink_manifest.json", manifest, "payload_sha256"))):
              check("linker_release_pointer.json", pointer, field, expected)
          tag = pointer.get("release_tag")
          if not isinstance(tag, str) or not re.fullmatch(r"linker-release-sha256-[0-9a-f]{64}", tag):
              fail(f"linker_release_pointer.json field release_tag is {tag!r}, expected linker-release-sha256-<64 hex>")
          (work / "release_tag").write_text(tag, encoding="utf-8")
          (work / "snapshot_zst_sha256").write_text(
              hex64("relink_manifest.json", manifest, "snapshot_zst_sha256"), encoding="utf-8")
          PY
          LINKER_RELEASE_TAG="$(cat "$WORK/release_tag")"
          SNAPSHOT_ZST_SHA256="$(cat "$WORK/snapshot_zst_sha256")"
          gh release download "$LINKER_RELEASE_TAG" -R Otzaria/LinkerToOtzaria -p meta.json -D "$WORK" || {
            echo "::error::recovery preflight: release $LINKER_RELEASE_TAG of Otzaria/LinkerToOtzaria has no readable meta.json"; exit 1; }
          # The Phase-2 check, on the real published file, at second 0.
          META_OK="$(python3 .github/scripts/verify_relink_recovery_snapshot.py --preflight --payload-meta "$WORK/meta.json")" || {
            echo "::error::recovery preflight: $LINKER_RELEASE_TAG meta.json is not consumable by verify_relink_recovery_snapshot.py (see the message above) — a recovery build would fail after the DB is rebuilt"; exit 1; }
          META_SCHEMA="${META_OK#*schema=}"
          META_SCHEMA="${META_SCHEMA%% *}"
          # The original snapshot the recovery relink ran against must still be
          # resolvable, byte-exact: Phase-2 downloads it to compare the rebuild.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/lines-snapshot-sha256-$SNAPSHOT_ZST_SHA256" > "$WORK/snapshot-release.json" || {
            echo "::error::recovery preflight: relink_manifest.json field snapshot_zst_sha256 is $SNAPSHOT_ZST_SHA256 but release lines-snapshot-sha256-$SNAPSHOT_ZST_SHA256 does not exist in $GITHUB_REPOSITORY"; exit 1; }
          jq -e --arg digest "sha256:$SNAPSHOT_ZST_SHA256" '
            .draft == false and
            ([.assets[] | select(.name == "lines_snapshot.db.zst" and .digest == $digest and .size > 0)] | length) == 1
          ' "$WORK/snapshot-release.json" > /dev/null || {
            echo "::error::recovery preflight: release lines-snapshot-sha256-$SNAPSHOT_ZST_SHA256 carries no published lines_snapshot.db.zst asset with digest sha256:$SNAPSHOT_ZST_SHA256"; exit 1; }
          echo "recovery preflight: meta.json of run $RECOVERY_RUN_ID ok (schema $META_SCHEMA, snapshot ${SNAPSHOT_ZST_SHA256:0:8}…, linker ${RUN_HEAD:0:7})"

  build-and-release:
    name: Build seforim.db + bundle + delta fan, publish release
    needs: reconcile
    if: needs.reconcile.outputs.reuse != 'true'
    runs-on: ${{ inputs.runner_selection == 'local' && fromJSON('["otzaria-db"]') || (inputs.runner_selection == 'server-2' && fromJSON('["self-hosted", "Linux", "X64", "server-2"]') || fromJSON('["self-hosted", "Linux", "ARM64"]')) }}
    # Self-hosted jobs have a five-day (7200-minute) execution ceiling.  What this
    # parent waits on is the whole child CHAIN in relink.yml, not one job: the default
    # target=local is ONE relink job with a 2880-minute ceiling plus a 30m publish;
    # the split fallbacks may legally consume 90m GPU NER + 480m CPU resolution
    # (including lease wait) + 30m publish.
    # At a 1440 parent ceiling a legal child could not be waited out:
    # this job spends ~55 minutes generating the DB and publishing the snapshot
    # BEFORE it dispatches, so a target=local child that ran to its own ceiling
    # always outlived the parent and was killed mid-flight by the `always()` cancel
    # step below — destroying a run that was still within contract.  The child's own
    # ceiling was then raised from 1440 to 2880 so a genuinely needed FULL local relink
    # (~20.5h GPU NER for 7,367 books, then resolve) fits inside a waiting build, and
    # this parent moved with it.  4320 (72h) is 60% of GitHub's cap and budgets
    # 4320 − 2970 (largest wait cap) − ~55 (pre-dispatch)
    # ≈ 1295 minutes for Phase-2, the patch fan and the ~5.1 GiB of uploads, which
    # measure ~130-160 minutes together.  The wait itself is capped explicitly
    # (RELINK_WAIT_CAP_MIN below), so the parent ceiling is a backstop, not the timer.
    # The two host leases below live 262800 s = 4380 min, an hour past this ceiling,
    # so no lease can expire under a job that is still running.
    timeout-minutes: 4320
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Logarithmic anchor offsets — covers ~16 versions back with 5 patches.
      # Older clients chain through the anchors; the full bundle is the
      # ultimate fallback.
      PATCH_OFFSETS: "1 2 4 8 16"
      # How many Sefaria images may fail to embed before the build is refused.
      # Each failure ships as a live textimages.sefaria.org <img src>, i.e. a
      # broken image for every offline client. ~420 images per build, of which
      # 10-11 are stubborn in a typical cycle (timeouts, one filter-blocked
      # URL), so 20 lets a weekly through while a broken CDN — or a filter that
      # started answering 418 for everything — fails loudly.
      IMAGE_EMBED_MAX_FAILURES: "20"
      PHASE2_IMPLEMENTATION_COMMIT: ${{ inputs.relink_recovery_run_id != '' && github.sha || inputs.source_commit }}

    steps:
      # MUST run before checkout. actions/checkout cleans the workspace with
      # `git clean -ffdx`, which recurses into the (gitignored) build/ dir; if a
      # canceled run left build/ as a tmpfs mountpoint, clean cannot rmdir the
      # mountpoint and checkout fails or hangs. Release any stale mount first.
      - name: Release stale RAM build dir (pre-checkout)
        run: |
          BUILD="$GITHUB_WORKSPACE/build"
          while mountpoint -q "$BUILD"; do
            echo "Stale tmpfs at build/ from a prior run — unmounting before checkout."
            sudo umount "$BUILD" 2>/dev/null || sudo umount -l "$BUILD"
          done

      - name: Checkout SeforimLibrary
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # Keep control-plane validators/lease helpers on the workflow revision
      # while the payload tree above remains pinned to source_commit.  Without
      # this split, a contract fix pushed after source selection is silently
      # replaced by the old scripts during checkout.
      - name: Checkout immutable pipeline control scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .pipeline-control
          sparse-checkout: |
            .github/scripts
            .github/host
            .github/contracts
            generator/common/src/jvmMain/kotlin/io/github/kdroidfilter/seforimlibrary/common/ids/DiskBackedLinkIdAllocator.kt
            generator/sefariasqlite/src/jvmMain/kotlin/io/github/kdroidfilter/seforimlibrary/sefariasqlite/GenerateLinkerLinks.kt
          persist-credentials: false

      # `gh` gives GH_TOKEN precedence over GITHUB_TOKEN. Verify the repository
      # permission exposed for each exact credential before spending hours on the
      # DB. Do not use an intentionally malformed release POST as a write probe:
      # GitHub can return validation status 422 before enforcing authorization,
      # which previously classified read-only credentials as writable. Prefer the
      # cross-repository credential because this pipeline necessarily performs
      # cross-repository handoffs; keep GITHUB_TOKEN as the verified fallback.
      - name: Preflight release write credentials
        env:
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          probe_contents_write() {
            local token="$1" response="$RUNNER_TEMP/repository-permissions.json" code
            [ -n "$token" ] || return 1
            code=$(curl --silent --show-error --output "$response" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY")
            [ "$code" = 200 ] && jq -e '.permissions.push == true' "$response" >/dev/null
          }
          automatic_writable=false
          cross_repo_writable=false
          if probe_contents_write "$AUTOMATIC_TOKEN"; then automatic_writable=true; fi
          if probe_contents_write "$CROSS_REPO_TOKEN"; then cross_repo_writable=true; fi
          echo "RELEASE_AUTOMATIC_WRITABLE=$automatic_writable" >> "$GITHUB_ENV"
          echo "RELEASE_CROSS_REPO_WRITABLE=$cross_repo_writable" >> "$GITHUB_ENV"
          if [ "$cross_repo_writable" = true ]; then
            echo 'RELEASE_TOKEN_KIND=cross-repo' >> "$GITHUB_ENV"
          elif [ "$automatic_writable" = true ]; then
            echo 'RELEASE_TOKEN_KIND=automatic' >> "$GITHUB_ENV"
          else
            echo '::error::Neither GITHUB_TOKEN nor PIPELINE_TOKEN can create releases; refusing to start the expensive DB build.'
            exit 1
          fi

      - name: Bootstrap durable cross-repo host lease
        run: >-
          bash .pipeline-control/.github/scripts/bootstrap_host_lock.sh
          .pipeline-control/.github/host/otzaria-pipeline.tmpfiles.conf

      - name: Disk before build
        run: |
          set -euo pipefail
          # Bare `df -h` asks WSL to stat every configured Windows drive and
          # exits nonzero when an optional drive is currently absent.  The DB
          # runner stores its distro and caches on C:, so inspect only the
          # filesystems this build can actually use.
          df -h /
          if [ -d /mnt/c ]; then
            df -h /mnt/c
          fi

      # ─── RAM-backed build dir (tmpfs) ──────────────────────────────────────
      # The DB build is fsync-bound on the OCI network block volume: CPU and RAM
      # sit idle in iowait while SQLite waits on per-commit fsyncs to slow
      # network storage. Backing build/ with a RAM tmpfs removes that stall.
      #
      # Mounted *at* build/ so every path stays byte-identical (build/seforim.db,
      # build/seforim.db.buildstate, build/seforim.db.zst) — the DB generation
      # and the delta/buildstate logic are completely untouched. Keep
      # -PinMemoryDb=false below: file-backed-on-tmpfs is fast *and* avoids the
      # second in-RAM copy that an in-memory DB would add on top of the tmpfs.
      #
      # Guards so a release build never falls and never endangers the other
      # repos' runners that share this host:
      #   • size=20G is a HARD cap — a runaway write fails THIS job cleanly with
      #     ENOSPC instead of OOM-killing the host. The peak is NOT the DB
      #     compression step (~11.8 GiB) but the atomic publish, which holds the
      #     old DB and the new candidate at the same time: seforim.db 6.75G +
      #     candidate 6.75G + siblings ~1.7G (seforim.db.zst, buildstate,
      #     buildstate.zst, lines_snapshot.db.zst) = ~15.2 GiB. 16G left only
      #     79 MiB short of that on 2026-09-10 and DbPublish refused the
      #     replace; 20G restores ~4.8 GiB of headroom as the DB keeps growing.
      #   • Preflight ABORTS before any work if another Runner.Worker is active
      #     or MemAvailable < 30 GiB — never share the box, never start tight. A
      #     clean abort + rerun beats a mid-build OOM, which is the real "fall".
      #   • A stale mount from a canceled run is released in a pre-checkout step.
      - name: Mount RAM-backed build dir (tmpfs)
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/build"

          # Take the real cross-repo lease before inspecting or cleaning shared
          # host state.  A completed/cancelled Linker run may have left its NER
          # process group alive; its start-time-bound scope is the only authority
          # to stop it.  Reaping first also makes the memory preflight measure the
          # resources this build will actually have.
          LEASE=/run/lock/otzaria/host-heavy.lock
          test -e "$LEASE" && test -w "$LEASE" || {
            echo "::error::$LEASE must be provisioned mode 0666 (see .github/host/otzaria-pipeline.tmpfiles.conf)"
            exit 1
          }
          echo "HOST_LEASE_STATE=$RUNNER_TEMP/host-lease.json" >> "$GITHUB_ENV"
          python3 .pipeline-control/.github/scripts/host_lease.py start --lock "$LEASE" \
            --state "$RUNNER_TEMP/host-lease.json" --ttl 262800
          python3 .pipeline-control/.github/scripts/reap_linker_ner.py

          # Exclusivity: this host runs three self-hosted runners (SeforimLibrary,
          # otzaria, SefariaExport). A RAM-heavy release build must not share the
          # box — a later spike in a concurrent job could OOM both. Our own job is
          # exactly one Runner.Worker; >1 means another repo's job is active.
          WORKERS=$(pgrep -cf 'Runner.Worker' || true)
          if [ "${WORKERS:-0}" -gt 1 ]; then
            echo "::error::${WORKERS} Runner.Worker processes active — another repo's job is running on this shared host. Refusing to start a RAM-backed build; rerun when the host is idle."
            exit 1
          fi

          # Peak need is ~29 GiB (12 GiB Phase-2 heap + ~15.2 GiB tmpfs at the
          # atomic publish + Gradle + base). Demand a near-idle box up front
          # rather than risk a late OOM mid-build. The old 24 GiB gate was
          # calibrated against a single ~7 GiB DB copy and understated the
          # publish, which holds two. Other generator forks stay capped at 8 GiB.
          AVAIL_KB=$(awk '/MemAvailable/{print $2}' /proc/meminfo)
          echo "MemAvailable: $((AVAIL_KB/1024/1024)) GiB"
          if [ "$AVAIL_KB" -lt $((30*1024*1024)) ]; then
            echo "::error::Only $((AVAIL_KB/1024/1024)) GiB available (<30 GiB). Aborting before work to avoid an OOM."
            exit 1
          fi

          # Mount. uid/gid = the runner user so the build can write without sudo.
          mkdir -p "$BUILD"
          sudo mount -t tmpfs -o size=20G,nr_inodes=1m,uid="$(id -u)",gid="$(id -g)",mode=0755 tmpfs "$BUILD"
          echo "tmpfs mounted on build/:"
          findmnt "$BUILD" || df -h "$BUILD"

      - name: Bridle daemon heaps + generator forks for the 16 GB runner
        run: |
          set -euo pipefail
          # ~/.gradle is the RUNNER's home and survives every run, so the old
          # `cat >>` appended these four lines again every week: the file grew
          # without bound and the effective value became "whichever duplicate
          # Gradle happened to read last". Same property values, written as ONE
          # marked block: drop any previous block plus any bare duplicate of a
          # managed line left by earlier runs, then append exactly one copy.
          # `grep -Fxq 'linkerHeap=12g'` in "Overlay pinned recovery Phase-2
          # implementation" still matches — emitted verbatim, one per line.
          mkdir -p ~/.gradle
          PROPS="$HOME/.gradle/gradle.properties"
          MANAGED="$RUNNER_TEMP/gradle-heaps-managed.properties"
          BEGIN='# >>> manual-generate-release managed heaps >>>'
          END='# <<< manual-generate-release managed heaps <<<'
          touch "$PROPS"
          cat > "$MANAGED" <<EOF
          org.gradle.jvmargs=-Xmx3g
          kotlin.compiler.execution.strategy=in-process
          generatorHeap=8g
          linkerHeap=12g
          EOF
          awk -v b="$BEGIN" -v e="$END" '
            NR == FNR { managed[$0] = 1; next }
            $0 == b { skip = 1; next }
            skip { if ($0 == e) skip = 0; next }
            !($0 in managed)
          ' "$MANAGED" "$PROPS" > "$PROPS.next"
          { printf '%s\n' "$BEGIN"; cat "$MANAGED"; printf '%s\n' "$END"; } >> "$PROPS.next"
          mv "$PROPS.next" "$PROPS"
          echo "gradle.properties: $(wc -l < "$PROPS") lines, exactly one managed block"

      - name: Verify durable Java 25 toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v java
          command -v javac
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          java_version="$($java_home/bin/java -XshowSettings:properties -version 2>&1 \
            | awk -F'= ' '/^[[:space:]]*java.version = / {print $2; exit}')"
          [[ "$java_version" == 25 || "$java_version" == 25.* ]] || {
            echo "::error::the durable runner must provide Java 25; found ${java_version:-missing}"
            exit 1
          }
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
          "$java_home/bin/java" -version

      # source_commit may be an old tree pinning an older Gradle; the selector comes
      # from pipeline control because that tree may predate it.
      - name: Select the durable Gradle toolchain for source_commit
        shell: bash
        run: bash .pipeline-control/.github/scripts/select_gradle_toolchain.sh "$GITHUB_WORKSPACE"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install DB workflow dependencies
        run: bash .pipeline-control/.github/scripts/install-db-workflow-deps.sh

      # Resolve both source archives by immutable tag and digest before any DB
      # work. No fetcher in the build is allowed to consult /releases/latest.
      - name: Verify pinned lineage and extract exact inputs
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::PIPELINE_TOKEN is required for pinned cross-repo downloads"; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEFARIA_TAG" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$OTZARIA_TAG" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$EXPECTED_LINKS_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OTZARIA_TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SEFARIA_METADATA_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SEFARIA_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OTZARIA_ASSET_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FORDB_ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FORDB_TAG" =~ ^fordb-sha256-[0-9a-f]{64}$ ]]
          [[ "${FORDB_TAG#fordb-sha256-}" == "$FORDB_ARCHIVE_SHA" ]]
          [[ "$CORRELATION_ID" =~ ^sefaria:[0-9]+:[0-9]+:[^:]+:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin refs/heads/otzaria:refs/remotes/origin/otzaria
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/otzaria
          test "$EXPECTED_LINKS_COMMIT" = "$OTZARIA_TARGET_COMMIT"

          INPUTS="$RUNNER_TEMP/manual-links-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$INPUTS"
          mkdir -p "$INPUTS/sefaria-assets" "$INPUTS/sefaria-extract" "$INPUTS/otzaria-assets" "$INPUTS/otzaria-extract"

          gh release download "$SEFARIA_TAG" -R Otzaria/SefariaExport \
            --pattern release_metadata.json --dir "$INPUTS/sefaria-assets"
          SEFARIA_METADATA="$INPUTS/sefaria-assets/release_metadata.json"
          echo "$SEFARIA_METADATA_SHA  $SEFARIA_METADATA" | sha256sum -c -
          python3 .pipeline-control/.github/scripts/validate-sefaria-release-metadata.py \
            "$SEFARIA_METADATA" "$SEFARIA_TAG" "$SEFARIA_ARCHIVE_SHA"
          : > "$INPUTS/sefaria-archive.tar.zst"
          while IFS=$'\t' read -r name size sha; do
            test "$(basename "$name")" = "$name"
            gh release download "$SEFARIA_TAG" -R Otzaria/SefariaExport \
              --pattern "$name" --dir "$INPUTS/sefaria-assets"
            test "$(stat -c %s "$INPUTS/sefaria-assets/$name")" = "$size"
            echo "$sha  $INPUTS/sefaria-assets/$name" | sha256sum -c -
            cat "$INPUTS/sefaria-assets/$name" >> "$INPUTS/sefaria-archive.tar.zst"
          done < <(jq -r '.archive.parts[] | [.name, (.size|tostring), .sha256] | @tsv' "$SEFARIA_METADATA")
          test "$(stat -c %s "$INPUTS/sefaria-archive.tar.zst")" = "$(jq -r .archive.size "$SEFARIA_METADATA")"
          echo "$SEFARIA_ARCHIVE_SHA  $INPUTS/sefaria-archive.tar.zst" | sha256sum -c -
          tar --use-compress-program=unzstd -xf "$INPUTS/sefaria-archive.tar.zst" -C "$INPUTS/sefaria-extract"
          # The immutable Sefaria archive contract places json/ and schemas/
          # directly at its root.  Do not rediscover that root with `find`: a
          # silent cardinality test made a valid export look corrupt and hid
          # which invariant had failed.
          SEFARIA_EXTRACT_ROOT="$INPUTS/sefaria-extract"
          test -d "$SEFARIA_EXTRACT_ROOT/json" || {
            echo "::error::pinned Sefaria archive is missing root json/"
            exit 1
          }
          test -d "$SEFARIA_EXTRACT_ROOT/schemas" || {
            echo "::error::pinned Sefaria archive is missing root schemas/"
            exit 1
          }
          test -n "$(find "$SEFARIA_EXTRACT_ROOT/json" -type f -name '*.json' -print -quit)" || {
            echo "::error::pinned Sefaria archive root json/ contains no JSON files"
            exit 1
          }
          test -n "$(find "$SEFARIA_EXTRACT_ROOT/schemas" -type f -name '*.json' -print -quit)" || {
            echo "::error::pinned Sefaria archive root schemas/ contains no JSON files"
            exit 1
          }

          gh release download "$OTZARIA_TAG" -R otzaria/otzaria-library \
            --pattern otzaria_release_provenance.json --dir "$INPUTS/otzaria-assets"
          PROVENANCE="$INPUTS/otzaria-assets/otzaria_release_provenance.json"
          python3 .pipeline-control/.github/scripts/validate_otzaria_provenance.py "$PROVENANCE" \
            --expected-target "$EXPECTED_LINKS_COMMIT" \
            --expected-tag "$OTZARIA_TAG" \
            --expected-asset-sha256 "$OTZARIA_ASSET_SHA"
          PROVENANCE_DIGEST="$(gh api \
            "repos/otzaria/otzaria-library/releases/tags/$OTZARIA_TAG" \
            --jq '.assets[] | select(.name=="otzaria_release_provenance.json") | .digest')"
          [[ "$PROVENANCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(sha256sum "$PROVENANCE" | cut -d' ' -f1)" == "${PROVENANCE_DIGEST#sha256:}" ]]
          test "$(jq -r .target_commit "$PROVENANCE")" = "$EXPECTED_LINKS_COMMIT"
          test "$(jq -r .asset.sha256 "$PROVENANCE")" = "$OTZARIA_ASSET_SHA"
          OTZARIA_ASSET_NAME=$(jq -r .asset.name "$PROVENANCE")
          test "$(basename "$OTZARIA_ASSET_NAME")" = "$OTZARIA_ASSET_NAME"
          RELEASE_TARGET=$(gh api \
            "repos/otzaria/otzaria-library/releases/tags/$OTZARIA_TAG" \
            --jq .target_commitish)
          test "$RELEASE_TARGET" = "$OTZARIA_TARGET_COMMIT"
          OTZARIA_TAG_COMMIT=$(gh api "repos/otzaria/otzaria-library/commits/$OTZARIA_TAG" --jq .sha)
          test "$OTZARIA_TAG_COMMIT" = "$OTZARIA_TARGET_COMMIT"
          gh release download "$OTZARIA_TAG" -R otzaria/otzaria-library \
            --pattern "$OTZARIA_ASSET_NAME" --dir "$INPUTS/otzaria-assets"
          test "$(stat -c %s "$INPUTS/otzaria-assets/$OTZARIA_ASSET_NAME")" = "$(jq -r .asset.size "$PROVENANCE")"
          echo "$OTZARIA_ASSET_SHA  $INPUTS/otzaria-assets/$OTZARIA_ASSET_NAME" | sha256sum -c -
          unzip -q "$INPUTS/otzaria-assets/$OTZARIA_ASSET_NAME" -d "$INPUTS/otzaria-extract"
          mapfile -t LINEAGES < <(find "$INPUTS/otzaria-extract" -maxdepth 2 -type f -name manual_links_lineage.json)
          test "${#LINEAGES[@]}" -eq 1
          LINEAGE="${LINEAGES[0]}"
          OTZARIA_EXTRACT_ROOT=$(dirname "$LINEAGE")
          CONFIG="$OTZARIA_EXTRACT_ROOT/manual_links_sync.json"
          test -f "$CONFIG" && test -d "$OTZARIA_EXTRACT_ROOT/links"
          test "$(jq -r .seforim_tool_commit "$LINEAGE")" = "$SOURCE_COMMIT"
          test "$(jq -r .sefaria.tag "$LINEAGE")" = "$SEFARIA_TAG"
          test "$(jq -r .sefaria.release_metadata_sha256 "$LINEAGE")" = "$SEFARIA_METADATA_SHA"
          test "$(jq -r .sefaria.archive.sha256 "$LINEAGE")" = "$SEFARIA_ARCHIVE_SHA"
          jq -e --slurpfile metadata "$SEFARIA_METADATA" \
            '.sefaria.run_id == $metadata[0].run_id and
             .sefaria.run_attempt == $metadata[0].run_attempt and
             .sefaria.archive == $metadata[0].archive' "$LINEAGE" >/dev/null
          test "$(sha256sum "$CONFIG" | cut -d' ' -f1)" = "$(jq -r .config_sha256 "$LINEAGE")"
          test "$(jq -r .target_commit "$PROVENANCE")" = "$OTZARIA_TARGET_COMMIT"
          test "$(jq -r .lineage_sha256 "$PROVENANCE")" = "$(sha256sum "$LINEAGE" | cut -d' ' -f1)"

          python3 - "$OTZARIA_EXTRACT_ROOT/links" "$LINEAGE" <<'PY'
          import hashlib, pathlib, struct, sys
          links, lineage = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          records = []
          for entry in links.iterdir():
              if entry.is_symlink() or not entry.is_file():
                  raise SystemExit(f"non-regular or nested links entry: {entry}")
              digest=hashlib.sha256()
              with entry.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024*1024),b""): digest.update(chunk)
              records.append((f"links/{entry.name}".encode(), entry.stat().st_size, digest.digest()))
          stream = bytearray(b"manual-links-tree-v1\0")
          for path, size, digest in sorted(records, key=lambda row: row[0]):
              stream += struct.pack(">I", len(path)) + path + struct.pack(">Q", size) + digest
          actual = hashlib.sha256(stream).hexdigest()
          import json
          expected = json.loads(lineage.read_text(encoding="utf-8"))["packaged_links_tree_sha256"]
          if actual != expected:
              raise SystemExit(f"packaged links tree mismatch: {actual} != {expected}")
          PY

          # Pin the ForDB rules archive by digest: fetch it once here and verify it
          # against the dispatch-time pin, then hand this exact local file to every
          # ForDB post-process so all three JVMs read byte-identical rules instead of
          # each re-fetching the moving `fordb-latest` tag. Fail closed on any drift.
          FORDB_ARCHIVE="$INPUTS/fordb_latest.zip"
          gh release download "$FORDB_TAG" -R otzaria/otzaria-library \
            --pattern fordb_latest.zip --dir "$INPUTS"
          echo "$FORDB_ARCHIVE_SHA  $FORDB_ARCHIVE" | sha256sum -c -

          {
            echo "SEFARIA_EXTRACT_ROOT=$SEFARIA_EXTRACT_ROOT"
            echo "OTZARIA_EXTRACT_ROOT=$OTZARIA_EXTRACT_ROOT"
            echo "MANUAL_LINKS_LINEAGE=$LINEAGE"
            echo "MANUAL_LINKS_CONFIG=$CONFIG"
            echo "OTZARIA_ASSET_NAME=$OTZARIA_ASSET_NAME"
            echo "FORDB_ARCHIVE=$FORDB_ARCHIVE"
            echo "FORDB_ARCHIVE_SHA=$FORDB_ARCHIVE_SHA"
          } >> "$GITHUB_ENV"

      # ─── Discover prior releases + decide db_version ───────────────────────
      # Tags are `v<dbVersion>-<utcTimestamp>` so version discovery is just
      # a regex on the tag list — no per-release asset fetch needed.
      # The version chain ignores pre vs final: a final release can seed/diff
      # against a pre-release predecessor and vice-versa.
      - name: Auto-discover prior releases
        id: discover
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft|not) | {tagName:.tag_name,isPrerelease:.prerelease,createdAt:.created_at,name:.name} | @json' \
            | jq -sc '.' > all-releases.json
          : > prior-versions.tsv  # cols: db_version<TAB>release_tag
          while IFS= read -r tag; do
            VER=$(echo "$tag" | grep -oE '^v[0-9]+-' | tr -d 'v-' || true)
            [ -n "$VER" ] && echo -e "${VER}\t${tag}" >> prior-versions.tsv
          done < <(jq -r '.[].tagName' all-releases.json)
          sort -k1,1nr -o prior-versions.tsv prior-versions.tsv
          echo "Prior releases (db_version → tag):"
          cat prior-versions.tsv || true

          if [ ! -s prior-versions.tsv ]; then
            echo "No prior release found — this is the first release."
            echo "db_version=1" >> "$GITHUB_OUTPUT"
            echo "has_prev=false" >> "$GITHUB_OUTPUT"
          else
            LAST_VER=$(head -n1 prior-versions.tsv | cut -f1)
            NEXT_VER=$((LAST_VER + 1))
            LAST_TAG=$(head -n1 prior-versions.tsv | cut -f2)
            echo "Most recent: db_version=$LAST_VER tag=$LAST_TAG → this build: db_version=$NEXT_VER"
            echo "db_version=$NEXT_VER" >> "$GITHUB_OUTPUT"
            echo "has_prev=true" >> "$GITHUB_OUTPUT"
            echo "seed_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute release tag (v<dbVersion>-<timestamp>)
        id: release_meta
        run: |
          STAMP=$(date -u +"%Y%m%d%H%M%S")
          TAG="v${{ steps.discover.outputs.db_version }}-${STAMP}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Seed allocator from offset-1 release
        if: steps.discover.outputs.has_prev == 'true'
        run: |
          set -euo pipefail
          SEED_TAG="${{ steps.discover.outputs.seed_tag }}"
          echo "Seeding allocator from release '$SEED_TAG'"
          mkdir -p build prev-dbs
          rm -f build/seforim.db.buildstate
          # E1: the buildstate ships compressed from db_version 27 on. It is a
          # 990 MB SQLite file that zstd -10 halves (measured 615.9 MB -> 312.2 MB,
          # 1.97x, 8.0 s to produce, ~1 s to expand), so this step downloads
          # ~500 MB instead of ~990 MB — run 33865604251 spent 128 s here.
          #
          # FALLBACK: the offset-1 release of the FIRST run after this change is
          # v26, which still carries only the uncompressed asset. Delete the
          # fallback branch once v27 is published (i.e. once no seed_tag this
          # workflow can pick predates the compressed asset).
          SEED_ZST="$RUNNER_TEMP/seed-buildstate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zst"
          SEED_ERR="$RUNNER_TEMP/seed-buildstate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.err"
          rm -f "$SEED_ZST" "$SEED_ERR"
          # gh prints a bare "no assets match the file pattern" on stderr and
          # never says WHICH asset it looked for (run 34024655297). Capture it
          # and fold it into the warning below, which does name the asset.
          if gh release download "$SEED_TAG" \
               --pattern 'seforim.db.buildstate.zst' \
               -O "$SEED_ZST" 2>"$SEED_ERR"; then
            unzstd -f "$SEED_ZST" -o build/seforim.db.buildstate
            rm -f "$SEED_ZST" "$SEED_ERR"
          else
            echo "::warning::release $SEED_TAG carries no seforim.db.buildstate.zst ($(tr -d '\r' < "$SEED_ERR" | head -n1)) — seeding from the pre-v27 uncompressed asset"
            rm -f "$SEED_ERR"
            gh release download "$SEED_TAG" \
              --pattern 'seforim.db.buildstate' \
              --dir build
          fi
          # Buildstate goes where generateSeforimDb expects it.
          ls -lh build/seforim.db.buildstate

      # ─── A1: overlap the patch fan's anchor downloads with the DB build ────
      # The fan reconstitutes every anchor from that release's 1.3 GB
      # seforim.db.zst; serially, inside the fan, that was 110-135 s per anchor
      # with the CPU idle (run 33865604251). Every tag it will consider is
      # already known here — prior-versions.tsv exists and the offsets are
      # fixed — and "Generate Seforim Database" below spends ~36 minutes of CPU
      # without touching the network. Fetch them in parallel across that window,
      # onto the workspace disk (~880 GB free), never onto the 16 GiB tmpfs
      # build/. The fan keeps its unchanged serial download as the fallback for
      # every anchor this does not deliver verified.
      - name: Prefetch patch-fan anchor DBs (background)
        if: steps.discover.outputs.has_prev == 'true'
        env:
          THIS_VER: ${{ steps.discover.outputs.db_version }}
        run: |
          set -euo pipefail
          ANCHORS="$RUNNER_TEMP/patch-fan-anchors.tsv"
          # The SAME derivation the fan walks later — one script, so a prefetch
          # can never resolve an offset to a different tag than the producer.
          bash .pipeline-control/.github/scripts/patch_fan_anchors.sh \
            "$THIS_VER" prior-versions.tsv $PATCH_OFFSETS > "$ANCHORS"
          # The plan, in words. `cat "$ANCHORS"` printed the raw TSV, which the
          # log renders as five bare lines reading `ANCHOR` with no tag, offset
          # or target version anywhere (run 34021998271). Same `anchor <tag>
          # (offset N):` prefix the prefetch script uses, so the plan line and
          # the `seforim.db.zst <size>` line it prints after querying the
          # release pair up by eye.
          awk -F'\t' -v this="$THIS_VER" '
            $1 == "ANCHOR"     { printf "anchor %s (offset %s): will patch v%s -> v%s\n", $4, $2, $3, this; next }
            $1 == "BELOW-ONE"  { printf "offset %s targets v%s (<1) - no anchor\n", $2, $3; next }
            $1 == "NO-RELEASE" { printf "offset %s targets v%s - no release carries that db_version\n", $2, $3; next }
                               { print }
          ' "$ANCHORS"
          # Warm or cold, stated before any download starts. The cache is
          # durable, digest-verified and bounded (see the script's header); it
          # is what stops a failed attempt from paying for the same 6.5 GB of
          # immutable release assets twice.
          bash .pipeline-control/.github/scripts/prefetch_patch_anchors.sh cache-report
          rm -rf prefetch
          bash .pipeline-control/.github/scripts/prefetch_patch_anchors.sh \
            start "$ANCHORS" prefetch

      # ─── Build seforim.db (full pipeline) ──────────────────────────────────
      # -PinMemoryDb=false: the Lucene index step otherwise copies the entire
      # ~7 GB seforim.db into a SQLite mode=memory database to speed up reads.
      # On the 16 GB runner that native footprint plus the 8 GB generator heap
      # blows past physical RAM and the kernel OOM-kills the job (surfacing as
      # "The operation was canceled"). Reading the DB from disk keeps the peak
      # bounded; the indexing stays well within budget.
      - name: Generate Seforim Database
        run: |
          # -PlinkerSidecar makes the Sefaria import dump the RefEntry→lineId sidecar
          # this build's LINKER Phase-2 needs (see next step).
          # -PimageCacheDir keeps the embedded textimages.sefaria.org images in a
          # durable per-runner cache: the build dir is tmpfs, so without it every
          # build re-downloads ~420 images and a transient timeout (10 of them in
          # 34021998271) leaves a remote URL where the previous build inlined the
          # image — a line change the relink recovery comparison must reject.
          IMAGE_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/seforimlibrary/textimages"
          mkdir -p "$IMAGE_CACHE_DIR"
          "$GRADLE" generateSeforimDb \
            -PexportDir="$SEFARIA_EXTRACT_ROOT" \
            -PsourceDir="$OTZARIA_EXTRACT_ROOT" \
            -PreleaseName=${{ steps.release_meta.outputs.release_tag }} \
            -PdbVersion=${{ steps.discover.outputs.db_version }} \
            -PinMemoryDb=false \
            -PlinkerSidecar=$PWD/build/linker_sidecar.tsv \
            -PforDbArchive="$FORDB_ARCHIVE" \
            -PforDbSha256="$FORDB_ARCHIVE_SHA" \
            -PimageCacheDir="$IMAGE_CACHE_DIR" \
            -PimageEmbedReport=$PWD/build/image-embed-report.json \
            --no-daemon --stacktrace
          # Every image the embedder could not inline stays in the line as a
          # live https://textimages.sefaria.org/... <img src>, which renders as a
          # broken placeholder for an offline client. The count used to be an
          # INFO log line nothing read, so v27 shipped 10 of them unnoticed;
          # surface each one and refuse the build past IMAGE_EMBED_MAX_FAILURES.
          IMAGE_REPORT=build/image-embed-report.json
          if [ ! -f "$IMAGE_REPORT" ]; then
            echo "::error::$IMAGE_REPORT missing — the Sefaria image embedder did not run"
            exit 1
          fi
          jq -r '"Image embedder: attempted=\(.attempted) cached=\(.cached) downloaded=\(.downloaded) fromDiskCache=\(.fromDiskCache) failed=\(.failed)"' "$IMAGE_REPORT"
          jq -r '.failures[] | "::warning::image not embedded (\(.reason)): \(.url)"' "$IMAGE_REPORT"
          IMAGE_FAILED=$(jq -r '.failed' "$IMAGE_REPORT")
          if [ "$IMAGE_FAILED" -gt "$IMAGE_EMBED_MAX_FAILURES" ]; then
            echo "::error::$IMAGE_FAILED Sefaria images could not be embedded (limit $IMAGE_EMBED_MAX_FAILURES) — they would ship as live network URLs"
            exit 1
          fi
          # catalog.pb is no longer produced; drop any stale copy so a dirty
          # self-hosted workspace can't smuggle it into the bundle or a patch.
          rm -f build/catalog.pb

      # ─── Serial linker cycle: snapshot → relink → inject, all IN this build ───
      # The linker's offsets are only valid against THIS build's cleaned line text, so the
      # snapshot must be dumped first, the linker re-links exactly the books it changed
      # (delta — minutes), and Phase-2 injects the fresh artifacts back into this same DB.
      # The published release therefore always carries a COMPLETE link set (no one-cycle lag).
      - name: Dump lines snapshot for the linker
        run: |
          set -euo pipefail
          # zstd policy, stated once for both compress steps in this job:
          #   * WORKER COUNT is byte-neutral.  A zstd frame depends on the level,
          #     the job size and the overlap size, not on how many workers chew
          #     through the jobs, so any `-T<n>` with n>=1 emits identical bytes.
          #     `-T0` is not "every CPU": it resolves to PHYSICAL cores, i.e. 8 of
          #     this runner's 16 vCPUs, so half the box idled for 515 s.  Sourced
          #     from the pipeline-control checkout because the payload checkout is
          #     pinned to source_commit and may predate this helper.
          #   * LEVEL does change bytes, and changes here exactly once: 19 -> 12
          #     for this snapshot only.  That is safe because the snapshot is
          #     transient — it is consumed exactly once by the relink, its tag is
          #     content-addressed, and the consumer verifies the sha256 that THIS
          #     step records below (relink.yml SNAPSHOT_SHA256).  The only
          #     cross-run comparison is the relink-recovery path, which compares
          #     a recovered run's snapshot digest with this build's and falls
          #     back to a semantic compare on mismatch -- so recovering a
          #     pre-change relink costs one slow (~10 min) verified fallback,
          #     never a wrong result.  Measured on Hebrew text: L12 is ~20-25%
          #     larger than L19 (830 MB -> ~1.0 GiB, uploaded twice at ~2 MB/s,
          #     ~+190 s) but ~7x faster to produce (515 s -> ~75 s): net ~-250 s.
          . .pipeline-control/.github/scripts/zstd_workers.sh
          # The raw snapshot is ~5.7 GB and exists only as zstd input.  Keeping
          # it beside the 7.5 GB DB on the 16 GB tmpfs leaves almost no room for
          # the compressed stream and forces needless swap pressure.  Write the
          # transient raw file to the runner's large disk; retain only its
          # content-addressed compressed handoff in RAM.
          RAW_SNAPSHOT="$RUNNER_TEMP/lines-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db"
          rm -f "$RAW_SNAPSHOT"
          trap 'rm -f "$RAW_SNAPSHOT"' EXIT
          "$GRADLE" :packaging:dumpLines \
            -PseforimDb=$PWD/build/seforim.db \
            -PlinesSnapshot="$RAW_SNAPSHOT" \
            --no-daemon --stacktrace
          zstd -T"$(zstd_workers)" -12 -f -o build/lines_snapshot.db.zst "$RAW_SNAPSHOT"
          # Pin the snapshot handoff: the relink verifies the release asset it downloads
          # against this digest, so it can only link the exact snapshot we produced.
          echo "SNAPSHOT_ZST_SHA256=$(sha256sum build/lines_snapshot.db.zst | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # Publish the ~1 GB snapshot outside Actions artifact storage.  Its tag is
      # content-addressed, so a repeated build either reuses byte-identical content or
      # fails closed; the Linker never resolves a moving "Latest" pointer.  This early
      # pre-release exists before the final DB release and remains available for an
      # exactly correlated recovery after a parent failure.
      #
      # SKIPPED in recovery mode: that path never dispatches a relink, so nothing
      # will ever download these bytes — it re-reads the ORIGINAL attempt's
      # snapshot release instead (see "Run LinkerToOtzaria relink…"). Runs
      # 34021998271 and 34024655297 each spent 464 s uploading a 987 MiB
      # pre-release that was orphaned the moment the next step chose the reuse
      # branch. The dump above still runs: the semantic compare in "Apply LINKER
      # links (Phase-2)" needs build/lines_snapshot.db.zst and its digest.
      - name: Publish immutable snapshot release for the relink run
        if: inputs.relink_recovery_run_id == ''
        env:
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          snapshot=build/lines_snapshot.db.zst
          tag="lines-snapshot-sha256-$SNAPSHOT_ZST_SHA256"
          # Ownership, for the failure hook below: 1 only when THIS attempt's own
          # `gh release create` succeeded. The tag is content-addressed, so a
          # later attempt that rebuilds byte-identical bytes resolves to an
          # existing release and must never claim (or delete) it.
          created_here=0
          expected_size=$(stat --format='%s' "$snapshot")
          [ "$expected_size" -le 2147483647 ] || {
            echo "::error::snapshot exceeds GitHub's 2 GiB release-asset limit"
            exit 1
          }
          use_token() {
            case "$1" in
              automatic)
                [ "$RELEASE_AUTOMATIC_WRITABLE" = true ] || return 1
                export GH_TOKEN="$AUTOMATIC_TOKEN"
                ;;
              cross-repo)
                [ "$RELEASE_CROSS_REPO_WRITABLE" = true ] || return 1
                export GH_TOKEN="$CROSS_REPO_TOKEN"
                ;;
              *) return 1 ;;
            esac
            token_kind="$1"
          }
          switch_token() {
            case "$token_kind" in
              automatic) use_token cross-repo ;;
              cross-repo) use_token automatic ;;
              *) return 1 ;;
            esac
          }
          use_token "$RELEASE_TOKEN_KIND" || {
            echo "::error::release credential preflight result is missing or invalid"
            exit 1
          }
          release_state() {
            local out="$RUNNER_TEMP/snapshot-release.json" err="$RUNNER_TEMP/snapshot-release.err"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$out" 2> "$err"; then
              if grep -q 'HTTP 404' "$err"; then echo absent; return 0; fi
              cat "$err" >&2
              return 1
            fi
            python3 - "$out" "$tag" "$SNAPSHOT_ZST_SHA256" "$expected_size" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          all_assets=value.get("assets",[])
          matches=[a for a in all_assets if a.get("name")=="lines_snapshot.db.zst"]
          identity=(value.get("tag_name")==sys.argv[2] and value.get("draft") is False and
                    value.get("prerelease") is True)
          if not identity or len(matches)>1 or len(all_assets)!=len(matches):
              print("conflict")
          elif not matches:
              print("empty")
          else:
              asset=matches[0]
              digest=asset.get("digest")
              if asset.get("size") != int(sys.argv[4]): print("conflict")
              elif digest in (None, ""): print("pending")
              else: print("exact" if digest=="sha256:"+sys.argv[3] else "conflict")
          PY
          }
          ensure_release() {
            local state
            state=$(release_state) || return 1
            case "$state" in
              exact|empty|pending) return 0 ;;
              conflict) echo "::error::conflicting immutable snapshot release $tag"; return 1 ;;
              absent) ;;
              *) echo "::error::unknown snapshot release state: $state"; return 1 ;;
            esac
            if gh release create "$tag" --target "$SOURCE_COMMIT" \
                --title "Immutable Linker snapshot $SNAPSHOT_ZST_SHA256" \
                --notes "Content-addressed lines snapshot for exact weekly Linker handoff." \
                --prerelease; then
              created_here=1
              return 0
            fi
            state=$(release_state) || state=query-error
            case "$state" in exact|empty|pending) return 0 ;; conflict) return 1 ;; esac
            switch_token || return 1
            state=$(release_state) || return 1
            case "$state" in
              exact|empty|pending) return 0 ;;
              conflict) return 1 ;;
              absent)
                if gh release create "$tag" --target "$SOURCE_COMMIT" \
                  --title "Immutable Linker snapshot $SNAPSHOT_ZST_SHA256" \
                  --notes "Content-addressed lines snapshot for exact weekly Linker handoff." \
                  --prerelease; then
                  created_here=1
                else
                  state=$(release_state) || return 1
                  case "$state" in exact|empty|pending) return 0 ;; *) return 1 ;; esac
                fi
                ;;
              *) echo "::error::unknown snapshot release state after credential fallback: $state"; return 1 ;;
            esac
          }
          ensure_release
          state=$(release_state)
          if [ "$state" = empty ]; then
            if ! gh release upload "$tag" "$snapshot"; then
              state=$(release_state) || state=query-error
              case "$state" in
                exact|pending) ;;
                conflict) exit 1 ;;
                *)
                  switch_token
                  gh release upload "$tag" "$snapshot"
                  ;;
              esac
            fi
          elif [ "$state" = conflict ]; then
            exit 1
          fi
          verified=false
          for _ in $(seq 1 24); do
            state=$(release_state) || state=query-error
            case "$state" in
              exact) verified=true; break ;;
              conflict|absent|empty) break ;;
            esac
            sleep 5
          done
          [ "$verified" = true ] || {
            echo "::error::snapshot release asset did not settle to the exact size and digest"
            exit 1
          }
          echo "SNAPSHOT_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "SNAPSHOT_RELEASE_CREATED_HERE=$created_here" >> "$GITHUB_ENV"
          echo "Published immutable snapshot release $tag (created_here=$created_here)"

      # Trigger the incremental relink on LinkerToOtzaria against THIS snapshot and wait.
      # Serial by design: the DB release depends on the relink succeeding — a linker
      # failure fails this build loudly instead of shipping a DB with silent gaps.
      # Cross-repo dispatch/watch/download needs PIPELINE_TOKEN (PAT), not GITHUB_TOKEN.
      - name: Run LinkerToOtzaria relink on this snapshot (and wait)
        id: relink
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          # Operator toggle (repo variable, no code change to flip): 'local' (default)
          # runs the complete relink on the durable x64/ROCm host. 'kaggle' retains
          # the split fallback and 'server' retains the Oracle fallback.
          SERIAL_LINKER_TARGET: ${{ vars.SERIAL_LINKER_TARGET || 'local' }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          RECOVERY_RUN_ID: ${{ inputs.relink_recovery_run_id }}
          # Overall cap on the relink wait, in minutes: what the target=local child
          # CHAIN may legally cost (relink 2880 + publish 30) plus an hour of grace.
          # Past it the child is out of contract and GitHub still has not reported it
          # terminal, so wait_for_relink_run.sh fails with the recovery recipe and a
          # named cause, instead of going quiet until this job's 4320-minute ceiling
          # kills it mid-wait.  That script takes the TIGHTER of this and its own
          # per-PATH derivation, so the kaggle (90 + 480 + 30) and server (480 + 30)
          # fallbacks are not held to the local budget — they cap at 660 and 570.
          # 1500 was the same bug one order of magnitude smaller: it left a legal
          # 1470-minute local child only 30 minutes of margin, while the script's
          # own single-job derivation cancelled a healthy kaggle child at 150.
          RELINK_WAIT_CAP_MIN: "2970"
          # For the A2 early upload below, which drives this build's own draft
          # release with the same preflighted credentials as the publish step.
          # GH_TOKEN above stays the cross-repo PAT for every `gh` call in this
          # step; the uploader is a separate process and exports its own.
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::PIPELINE_TOKEN secret is empty or missing on this repo — re-run: gh secret set PIPELINE_TOKEN -R Otzaria/SeforimLibrary"; exit 1; }
          if [ -n "$RECOVERY_RUN_ID" ]; then
            # Explicit recovery is deliberately narrower than normal reuse: accept one
            # exact, already-successful relink-recovery run whose title binds it to one
            # exact failed build attempt with this correlation. The payload manifest is
            # independently checked against its original content-addressed snapshot;
            # any rebuilt-snapshot drift is checked semantically before Phase-2.
            [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::relink_recovery_run_id must be a positive integer"; exit 1; }
            RECOVERY_JSON="$RUNNER_TEMP/relink-recovery-run.json"
            gh api "repos/Otzaria/LinkerToOtzaria/actions/runs/$RECOVERY_RUN_ID" > "$RECOVERY_JSON"
            IFS=$'\t' read -r RECOVERY_STATUS RECOVERY_CONCLUSION RECOVERY_EVENT RECOVERY_PATH RECOVERY_ATTEMPT RECOVERY_HEAD RECOVERY_TITLE \
              < <(jq -er '[.status, .conclusion, .event, .path, (.run_attempt|tostring), .head_sha, .display_title] | @tsv' "$RECOVERY_JSON")
            [ -n "$RECOVERY_TITLE" ] || { echo "::error::malformed relink recovery run metadata"; exit 1; }
            [ "$RECOVERY_STATUS" = completed ] && [ "$RECOVERY_CONCLUSION" = success ] || { echo "::error::relink recovery run is not completed:success"; exit 1; }
            [ "$RECOVERY_EVENT" = workflow_dispatch ] && [ "$RECOVERY_PATH" = .github/workflows/relink.yml ] || { echo "::error::relink recovery run has an unexpected event or workflow"; exit 1; }
            [[ "$RECOVERY_ATTEMPT" =~ ^[1-9][0-9]*$ ]] && [[ "$RECOVERY_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::relink recovery run has malformed attempt or head SHA"; exit 1; }
            if [[ "$RECOVERY_TITLE" =~ ^relink-recovery\ request=([0-9a-f]{64})\ parent=([1-9][0-9]*):([1-9][0-9]*)$ ]]; then
              RELINK_REQUEST_ID="${BASH_REMATCH[1]}"
              EXPECTED_PARENT_RUN_ID="${BASH_REMATCH[2]}"
              EXPECTED_PARENT_RUN_ATTEMPT="${BASH_REMATCH[3]}"
            else
              echo "::error::run $RECOVERY_RUN_ID is not an exactly correlated recovery run"; exit 1
            fi

            PARENT_JSON="$RUNNER_TEMP/relink-recovery-parent.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_PARENT_RUN_ID/attempts/$EXPECTED_PARENT_RUN_ATTEMPT" > "$PARENT_JSON"
            EXPECTED_PARENT_TITLE="manual-generate-release correlation=$CORRELATION_ID"
            jq -e --argjson attempt "$EXPECTED_PARENT_RUN_ATTEMPT" --arg title "$EXPECTED_PARENT_TITLE" '
              .status == "completed" and .conclusion == "failure" and
              .event == "workflow_dispatch" and .path == ".github/workflows/manual-generate-release.yml" and
              .run_attempt == $attempt and .display_title == $title
            ' "$PARENT_JSON" >/dev/null || { echo "::error::recovery parent is not the exact failed build attempt for this correlation"; exit 1; }

            RECOVERY_OUTPUT_TAG="linker-output-${RELINK_REQUEST_ID}-${RECOVERY_ATTEMPT}"
            gh api "repos/Otzaria/LinkerToOtzaria/releases/tags/$RECOVERY_OUTPUT_TAG" --jq \
              '{isDraft:.draft,isPrerelease:.prerelease,targetCommitish:.target_commitish,assets:[.assets[]|{name,size,digest}]}' \
              > "$RUNNER_TEMP/relink-recovery-output-release.json"
            python3 - "$RUNNER_TEMP/relink-recovery-output-release.json" "$RECOVERY_HEAD" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          names={item.get("name") for item in value.get("assets",[])}
          if not (value.get("isDraft") is False and value.get("isPrerelease") is True and
                  value.get("targetCommitish")==sys.argv[2] and
                  names=={"linker_release_pointer.json","relink_manifest.json"}):
              raise SystemExit("recovery Linker output release identity/assets differ")
          PY
            RECOVERY_MANIFEST="$RUNNER_TEMP/relink-recovery-manifest.json"
            rm -f "$RECOVERY_MANIFEST"
            gh release download "$RECOVERY_OUTPUT_TAG" -R Otzaria/LinkerToOtzaria \
              -p relink_manifest.json -O "$RECOVERY_MANIFEST"
            EXPECTED_LINKER_SNAPSHOT_ZST_SHA256="$(jq -er \
              --arg request "$RELINK_REQUEST_ID" --argjson run "$RECOVERY_RUN_ID" \
              --argjson attempt "$RECOVERY_ATTEMPT" --argjson parent "$EXPECTED_PARENT_RUN_ID" \
              --argjson parent_attempt "$EXPECTED_PARENT_RUN_ATTEMPT" '
                select(.schema_version==2 and .relink_request_id==$request and
                       .relink_run_id==$run and .relink_run_attempt==$attempt and
                       .parent_run_id==$parent and .parent_run_attempt==$parent_attempt) |
                .snapshot_zst_sha256 |
                select(type=="string" and test("^[0-9a-f]{64}$"))
              ' "$RECOVERY_MANIFEST")"
            SNAPSHOT_RELEASE_TAG="lines-snapshot-sha256-$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256"
            SNAPSHOT_RELEASE="$RUNNER_TEMP/relink-recovery-snapshot-release.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SNAPSHOT_RELEASE_TAG" > "$SNAPSHOT_RELEASE"
            python3 - "$SNAPSHOT_RELEASE" "$SNAPSHOT_RELEASE_TAG" "$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          all_assets=value.get("assets",[])
          assets=[a for a in all_assets if a.get("name")=="lines_snapshot.db.zst"]
          if not (value.get("tag_name")==sys.argv[2] and value.get("draft") is False and
                  value.get("prerelease") is True and len(all_assets)==len(assets)==1 and
                  assets[0].get("size",0)>0 and assets[0].get("digest")=="sha256:"+sys.argv[3]):
              raise SystemExit("recovery parent snapshot release is missing or not byte-exact")
          PY

            RUN="$RECOVERY_RUN_ID"
            {
              echo "RELINK_REQUEST_ID=$RELINK_REQUEST_ID"
              echo "RELINK_TITLE=$RECOVERY_TITLE"
              echo "KAGGLE_TITLE=kaggle-relink request=$RELINK_REQUEST_ID parent=$EXPECTED_PARENT_RUN_ID:$EXPECTED_PARENT_RUN_ATTEMPT"
            } >> "$GITHUB_ENV"
            {
              echo "run_id=$RUN"
              echo "request_id=$RELINK_REQUEST_ID"
              echo "parent_run_id=$EXPECTED_PARENT_RUN_ID"
              echo "parent_run_attempt=$EXPECTED_PARENT_RUN_ATTEMPT"
            } >> "$GITHUB_OUTPUT"
            echo "Reusing exact successful recovery relink $RUN for failed parent $EXPECTED_PARENT_RUN_ID:$EXPECTED_PARENT_RUN_ATTEMPT"
          else
          # Per-attempt correlation identity: a deterministic sha256 over this exact
          # attempt + the saga correlation + the pinned inputs + the target. A rerun
          # (new attempt) yields a DIFFERENT id, so discovery/cleanup of this attempt
          # can never touch another's runs. Threaded end-to-end: dispatch → both
          # LinkerToOtzaria run-names → relink manifest → build provenance.
          REQUEST_JSON=$(jq -cn \
            --arg schema relink-request-v1 \
            --arg parent_repository "$GITHUB_REPOSITORY" \
            --argjson parent_run_id "$GITHUB_RUN_ID" \
            --argjson parent_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg correlation_id "$CORRELATION_ID" \
            --arg sefaria_tag "$SEFARIA_TAG" \
            --arg sefaria_release_metadata_sha256 "$SEFARIA_METADATA_SHA" \
            --arg snapshot_zst_sha256 "$SNAPSHOT_ZST_SHA256" \
            --arg target "$SERIAL_LINKER_TARGET" \
            '{schema: $schema, parent_repository: $parent_repository,
              parent_run_id: $parent_run_id, parent_run_attempt: $parent_run_attempt,
              correlation_id: $correlation_id, sefaria_tag: $sefaria_tag,
              sefaria_release_metadata_sha256: $sefaria_release_metadata_sha256,
              snapshot_zst_sha256: $snapshot_zst_sha256, target: $target}')
          RELINK_REQUEST_ID=$(printf '%s' "$REQUEST_JSON" | sha256sum | cut -d' ' -f1)
          # Must byte-match the run-name templates in relink.yml / kaggle-relink.yml —
          # every consumer compares the FULL title with ==, never contains.
          export RELINK_TITLE="relink request=$RELINK_REQUEST_ID parent=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          export KAGGLE_TITLE="kaggle-relink request=$RELINK_REQUEST_ID parent=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          {
            echo "RELINK_REQUEST_ID=$RELINK_REQUEST_ID"
            echo "RELINK_TITLE=$RELINK_TITLE"
            echo "KAGGLE_TITLE=$KAGGLE_TITLE"
          } >> "$GITHUB_ENV"
          echo "relink request id: $RELINK_REQUEST_ID"
          # The child must run the LinkerToOtzaria main we observe NOW — a push landing
          # mid-dispatch would silently change the engine under our pinned inputs.
          # Capture the expected head + the dispatch time; discovery requires both.
          LINKER_HEAD=$(gh api repos/Otzaria/LinkerToOtzaria/commits/main --jq .sha)
          # The wait budget is a cross-repository contract.  Pass the digest of
          # the exact contract this parent used; both Linker entry workflows
          # reject a different digest before any GPU/CPU-heavy work starts.
          WAIT_CONTRACT_SHA256=$(sha256sum .pipeline-control/.github/contracts/linker_relink_timeouts_v1.json | cut -d' ' -f1)
          [[ "$WAIT_CONTRACT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid Linker wait-contract digest"; exit 1; }
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Owner decision (2026-07-23): the default split path runs only raw NER on
          # Kaggle, then resolves those responses on the Oracle ARM box.  Therefore BOTH
          # targets need the cross-repo host lease released for the entire child lifetime:
          # target=kaggle needs it for the resolver stage, while target=server needs it
          # for the legacy unsplit relink.  Reacquire only after the exact child is
          # terminal, before this build touches the DB again.
          # Inputs reach the dispatch ONLY via env (validated sha/tag shapes at job
          # entry) — nothing raw is interpolated into this script body.
          case "$SERIAL_LINKER_TARGET" in
            local|kaggle|server) ;;
            *) echo "::error::SERIAL_LINKER_TARGET must be 'local', 'kaggle' or 'server', got '$SERIAL_LINKER_TARGET'"; exit 1 ;;
          esac
          # Cleanup may search by exact title only after THIS attempt reached its
          # dispatch boundary.  RELINK_REQUEST_ID is computed earlier and can also be
          # present in an attempt that fails before dispatch; treating that as proof of
          # ownership let a later GitHub rerun cancel an older attempt's live recovery.
          echo "RELINK_DISPATCH_STARTED=1" >> "$GITHUB_ENV"
          python3 .pipeline-control/.github/scripts/host_lease.py release --state "$HOST_LEASE_STATE"
          case "$SERIAL_LINKER_TARGET" in
            local)
              DISPATCHED_WORKFLOW=relink.yml
              gh workflow run relink.yml -R Otzaria/LinkerToOtzaria \
                -f library_run_id="$GITHUB_RUN_ID" -f target=local \
                -f relink_request_id="$RELINK_REQUEST_ID" \
                -f parent_run_attempt="$GITHUB_RUN_ATTEMPT" \
                -f wait_contract_sha256="$WAIT_CONTRACT_SHA256" \
                -f sefaria_tag="$SEFARIA_TAG" \
                -f snapshot_sha256="$SNAPSHOT_ZST_SHA256" \
                -f sefaria_release_metadata_sha256="$SEFARIA_METADATA_SHA" ;;
            kaggle)
              DISPATCHED_WORKFLOW=kaggle-relink.yml
              gh workflow run kaggle-relink.yml -R Otzaria/LinkerToOtzaria \
                -f library_run_id="$GITHUB_RUN_ID" \
                -f relink_request_id="$RELINK_REQUEST_ID" \
                -f parent_run_attempt="$GITHUB_RUN_ATTEMPT" \
                -f wait_contract_sha256="$WAIT_CONTRACT_SHA256" \
                -f sefaria_tag="$SEFARIA_TAG" \
                -f snapshot_sha256="$SNAPSHOT_ZST_SHA256" \
                -f sefaria_release_metadata_sha256="$SEFARIA_METADATA_SHA" ;;
            server)
              DISPATCHED_WORKFLOW=relink.yml
              gh workflow run relink.yml -R Otzaria/LinkerToOtzaria \
                -f library_run_id="$GITHUB_RUN_ID" -f target=server \
                -f relink_request_id="$RELINK_REQUEST_ID" \
                -f parent_run_attempt="$GITHUB_RUN_ATTEMPT" \
                -f wait_contract_sha256="$WAIT_CONTRACT_SHA256" \
                -f sefaria_tag="$SEFARIA_TAG" \
                -f snapshot_sha256="$SNAPSHOT_ZST_SHA256" \
                -f sefaria_release_metadata_sha256="$SEFARIA_METADATA_SHA" ;;
          esac
          # One line at the dispatch boundary: what was asked of whom, with the
          # exact non-secret inputs and the correlation identity discovery below
          # matches on. `gh workflow run` returns no run id, so the run URL is
          # printed once by the wait loop below the moment discovery resolves it
          # — deliberately NOT duplicated here.
          echo "dispatched $DISPATCHED_WORKFLOW to Otzaria/LinkerToOtzaria: target=$SERIAL_LINKER_TARGET library_run_id=$GITHUB_RUN_ID parent_run_attempt=$GITHUB_RUN_ATTEMPT relink_request_id=$RELINK_REQUEST_ID wait_contract_sha256=$WAIT_CONTRACT_SHA256 sefaria_tag=$SEFARIA_TAG snapshot_sha256=$SNAPSHOT_ZST_SHA256"
          # ─── A2 / E2: nothing is uploaded early from HERE any more ─────────
          # A2 used this idle window (20 min of discovery plus the relink itself,
          # 1119 s on run 33865604251) to push lines_snapshot.db.zst to the draft
          # release. E2 stopped publishing that asset on the DB release entirely
          # — the identical bytes are already on the content-addressed
          # `lines-snapshot-sha256-<sha>` pre-release this job published before
          # the dispatch, and build_provenance.json now names that release — so
          # there is nothing left here to upload. The next byte-final asset is
          # seforim.db.buildstate.zst, and only after "Apply LINKER links
          # (Phase-2)" has allocated this build's fresh stable link ids into the
          # buildstate (DiskBackedLinkIdAllocator); it is uploaded in the
          # background from right after Phase-2 until publish.
          #
          # DRAFT_RELEASE_CREATED stays set here, unchanged: it has always been
          # an optimistic "a draft for this tag may exist from this point on"
          # marker (the early upload creates the draft in the background and may
          # never get there), and the cleanup step resolves the draft by exact
          # identity and simply reports "nothing to delete" when there is none.
          # Keeping it set covers the draft the early buildstate upload creates
          # right after Phase-2 (whose step sets it again, for recovery mode).
          echo "DRAFT_RELEASE_CREATED=1" >> "$GITHUB_ENV"
          # Identify OUR run: EXACT title equality on the per-attempt request id, exactly
          # one match (two runs sharing a fresh id is a broken invariant — refuse to
          # guess), created at/after our dispatch, at the head we captured. Fully
          # paginated REST over a created>=dispatch window — never "the last N runs"
          # (fresh completed runs cannot push our child out of view) — and the window
          # INCLUDES completed runs, so a child that failed fast is still found (the
          # wait loop below then reports its real conclusion). 20 min budget: the
          # kaggle-relink dispatcher (ubuntu-latest) needs 1-3 min to register the
          # JIT and queue the relink before the run can even appear.
          RUN=""
          for _ in $(seq 1 120); do
            sleep 10
            # A transient listing error just means "retry next round"; the final
            # hard failure below keeps this fail-loud, not fail-open.
            if ! ROWS=$(gh api --paginate -X GET "repos/Otzaria/LinkerToOtzaria/actions/workflows/relink.yml/runs" \
              -f created=">=$DISPATCHED_AT" -f per_page=100 \
              --jq '.workflow_runs[] | select(.display_title == env.RELINK_TITLE) | [(.id|tostring), .head_sha, .created_at] | @tsv'); then
              continue
            fi
            ROWS=$(printf '%s\n' "$ROWS" | awk -F'\t' 'NF && !seen[$1]++')
            N=$(printf '%s' "$ROWS" | grep -c . || true)
            if [ "$N" -gt 1 ]; then
              echo "::error::$N relink runs share request id $RELINK_REQUEST_ID — refusing to guess"; exit 1
            fi
            if [ "$N" -eq 1 ]; then
              IFS=$'\t' read -r RUN RUN_HEAD CREATED <<<"$ROWS"
              if [[ "$CREATED" < "$DISPATCHED_AT" ]]; then
                echo "::error::relink run $RUN was created at $CREATED, before our dispatch at $DISPATCHED_AT — a stale run carries our id"; exit 1
              fi
              if [ "$RUN_HEAD" != "$LINKER_HEAD" ]; then
                echo "::error::relink run $RUN is at $RUN_HEAD but LinkerToOtzaria main was $LINKER_HEAD at dispatch — main moved mid-dispatch; rerun this build"; exit 1
              fi
              break
            fi
          done
          [ -n "$RUN" ] || { echo "::error::relink run ($RELINK_TITLE) never appeared"; exit 1; }
          echo "relink run: $RUN"
          RUN_URL="https://github.com/Otzaria/LinkerToOtzaria/actions/runs/$RUN"
          {
            echo "run_id=$RUN"
            echo "request_id=$RELINK_REQUEST_ID"
            echo "parent_run_id=$GITHUB_RUN_ID"
            echo "parent_run_attempt=$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          # The wait loop, its 10-minute heartbeat and its terminal-state reporting are
          # one cohesive block and live in a script, so this body stays well under the
          # 21,000-character ceiling GitHub Actions puts on a single `run:` template —
          # the sibling patch-fan step crossed it and the whole workflow stopped loading
          # (run 34195296928). The script sets the same `set -euo pipefail`, prints the
          # same lines, and a non-zero exit fails this step exactly as its inline
          # `exit 1`s did. Nothing below reads a variable it sets, so a child process is
          # enough. RUN, RUN_URL and RELINK_REQUEST_ID are shell locals here, so they are
          # handed over explicitly; everything else it reads is already step env.
          RELINK_RUN_ID="$RUN" RELINK_RUN_URL="$RUN_URL" \
            RELINK_REQUEST_ID="$RELINK_REQUEST_ID" \
            bash .pipeline-control/.github/scripts/wait_for_relink_run.sh
          # E2: there is no early upload to reap here any more — this step no
          # longer starts one (see the A2/E2 note above). The 'buildstate' label
          # started right after Phase-2 is reaped first thing in the publish
          # step, before it touches the same release.
          # The exact child is terminal now. Reacquire before this job touches the DB
          # again; if another heavy phase won the race, fail rather than overlap.
          python3 .pipeline-control/.github/scripts/host_lease.py start \
            --lock /run/lock/otzaria/host-heavy.lock \
            --state "$HOST_LEASE_STATE" --ttl 262800
          fi
          : "${EXPECTED_LINKER_SNAPSHOT_ZST_SHA256:=$SNAPSHOT_ZST_SHA256}"
          echo "EXPECTED_LINKER_SNAPSHOT_ZST_SHA256=$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256" >> "$GITHUB_ENV"

      # Recovery keeps the expensive source/data build pinned to source_commit, but
      # Phase-2 must run the fail-closed implementation shipped by this workflow
      # revision. Copy only the two reviewed source files and make the one exact heap
      # substitution required by the pinned task; all other payload code remains pinned.
      - name: Overlay pinned recovery Phase-2 implementation
        if: inputs.relink_recovery_run_id != ''
        run: |
          set -euo pipefail
          files=(
            generator/common/src/jvmMain/kotlin/io/github/kdroidfilter/seforimlibrary/common/ids/DiskBackedLinkIdAllocator.kt
            generator/sefariasqlite/src/jvmMain/kotlin/io/github/kdroidfilter/seforimlibrary/sefariasqlite/GenerateLinkerLinks.kt
          )
          for file in "${files[@]}"; do
            test -f ".pipeline-control/$file"
            install -m 0644 ".pipeline-control/$file" "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          path = Path("generator/sefariasqlite/build.gradle.kts")
          legacy = 'jvmArgs = listOf("-Xmx6g")'
          configured = 'jvmArgs = listOf("-Xmx$linkerHeap", "-XX:+UseG1GC")'
          text = path.read_text(encoding="utf-8")
          legacy_count = text.count(legacy)
          configured_count = text.count(configured)
          if legacy_count == 1 and configured_count == 0:
              text = text.replace(legacy, configured)
              path.write_text(text, encoding="utf-8")
          elif legacy_count == 0 and configured_count == 1:
              pass  # The pinned source already uses the workflow-configured Phase-2 heap.
          else:
              raise SystemExit(
                  "pinned Phase-2 task must contain exactly one legacy or configured heap declaration"
              )
          PY
          grep -Fq 'import io.github.kdroidfilter.seforimlibrary.common.ids.DiskBackedLinkIdAllocator' \
            generator/sefariasqlite/src/jvmMain/kotlin/io/github/kdroidfilter/seforimlibrary/sefariasqlite/GenerateLinkerLinks.kt
          if grep -Fq 'InMemoryIdAllocator' \
            generator/sefariasqlite/src/jvmMain/kotlin/io/github/kdroidfilter/seforimlibrary/sefariasqlite/GenerateLinkerLinks.kt; then
            echo "::error::Recovery Phase-2 still references the unbounded in-memory allocator"
            exit 1
          fi
          grep -Fq 'jvmArgs = listOf("-Xmx$linkerHeap", "-XX:+UseG1GC")' generator/sefariasqlite/build.gradle.kts
          grep -Fxq 'linkerHeap=12g' ~/.gradle/gradle.properties
          rm -rf generator/common/build generator/sefariasqlite/build
          echo "Recovery Phase-2 implementation is pinned to $PHASE2_IMPLEMENTATION_COMMIT"

      # Inject the payload the relink run just produced into THIS DB. The exact
      # request+attempt pointer names a content-addressed final Linker release; no
      # Actions artifact storage and no moving "latest" pointer are involved.
      # -PlinkerStrict: in the serial cycle every source line must map and hash-match;
      # any stale/unmapped source means broken lineage → fail the build.
      - name: Apply LINKER links (Phase-2)
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          RELINK_RUN_ID: ${{ steps.relink.outputs.run_id }}
          EXPECTED_RELINK_REQUEST_ID: ${{ steps.relink.outputs.request_id }}
          EXPECTED_RELINK_PARENT_RUN_ID: ${{ steps.relink.outputs.parent_run_id }}
          EXPECTED_RELINK_PARENT_RUN_ATTEMPT: ${{ steps.relink.outputs.parent_run_attempt }}
        run: |
          set -euo pipefail
          rm -rf build/linker && mkdir -p build/linker
          RUN_ATTEMPT="$(gh api "repos/Otzaria/LinkerToOtzaria/actions/runs/$RELINK_RUN_ID" --jq .run_attempt)"
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          OUTPUT_TAG="linker-output-${EXPECTED_RELINK_REQUEST_ID}-${RUN_ATTEMPT}"
          gh release download "$OUTPUT_TAG" -R Otzaria/LinkerToOtzaria \
            -p linker_release_pointer.json -p relink_manifest.json -D build/linker
          POINTER=build/linker/linker_release_pointer.json
          LINKER_RELEASE_TAG="$(jq -er .release_tag "$POINTER")"
          POINTER_PAYLOAD_SHA="$(jq -er .payload_sha256 "$POINTER")"
          [[ "$LINKER_RELEASE_TAG" =~ ^linker-release-sha256-[0-9a-f]{64}$ ]]
          [[ "$POINTER_PAYLOAD_SHA" =~ ^[0-9a-f]{64}$ ]]
          jq -e --arg request "$EXPECTED_RELINK_REQUEST_ID" --argjson run "$RELINK_RUN_ID" \
            --argjson attempt "$RUN_ATTEMPT" '
              .schema_version==1 and .relink_request_id==$request and
              .relink_run_id==$run and .relink_run_attempt==$attempt
            ' "$POINTER" >/dev/null
          gh release download "$LINKER_RELEASE_TAG" -R Otzaria/LinkerToOtzaria \
            -p linker_links.zst -D build/linker
          REMOTE_PAYLOAD_DIGEST="$(gh api \
            "repos/Otzaria/LinkerToOtzaria/releases/tags/$LINKER_RELEASE_TAG" \
            --jq '.assets[]|select(.name=="linker_links.zst")|.digest')"
          [ "$REMOTE_PAYLOAD_DIGEST" = "sha256:$POINTER_PAYLOAD_SHA" ] || {
            echo "::error::Linker pointer differs from final release payload digest"; exit 1;
          }
          # The relink manifest binds this payload to the exact inputs it was linked
          # against. Verify — fail-closed — that the payload matches its own digest, that
          # the relink used the selected original snapshot, and that it is the run we
          # selected. A recovery rebuild is compared semantically below before Phase-2.
          M=build/linker/relink_manifest.json
          test -f "$M"
          # Payload integrity — an independent cross-file digest check.
          echo "$(jq -r .payload_sha256 "$M")  build/linker/linker_links.zst" | sha256sum -c -
          # The relink run's ACTUAL GitHub identity — not the manifest's self-report.
          RUN_HEAD_SHA="$(gh api "repos/Otzaria/LinkerToOtzaria/actions/runs/$RELINK_RUN_ID" --jq .head_sha)"
          # Strictly validate the manifest before recording anything: exact key set, field
          # types/formats, binding to this build's pinned Sefaria + snapshot, and — crucially —
          # that its self-reported linker_commit / relink_run_attempt EQUAL the relink run's
          # real head_sha / attempt. A forged or drifted manifest fails here, fail-closed.
          MANIFEST="$M" EXP_SEFARIA_TAG="$SEFARIA_TAG" EXP_SNAPSHOT_SHA="$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256" \
          EXP_RUN_ID="$RELINK_RUN_ID" RUN_HEAD_SHA="$RUN_HEAD_SHA" RUN_ATTEMPT="$RUN_ATTEMPT" \
          EXP_REQUEST_ID="$EXPECTED_RELINK_REQUEST_ID" PARENT_RUN_ID="$EXPECTED_RELINK_PARENT_RUN_ID" PARENT_RUN_ATTEMPT="$EXPECTED_RELINK_PARENT_RUN_ATTEMPT" \
          python3 - >> "$GITHUB_ENV" <<'PY'
          import json, os, re, sys
          def _no_dupes(pairs):
              seen = {}
              for k, v in pairs:
                  if k in seen:
                      sys.exit(f"relink manifest: duplicate key {k!r}")
                  seen[k] = v
              return seen
          m = json.load(open(os.environ["MANIFEST"], encoding="utf-8"), object_pairs_hook=_no_dupes)
          if set(m) != {"schema_version", "sefaria_tag", "snapshot_zst_sha256", "engine_fingerprint",
                        "payload_sha256", "linker_commit", "relink_run_id", "relink_run_attempt",
                        "relink_request_id", "parent_run_id", "parent_run_attempt"}:
              sys.exit(f"relink manifest key set mismatch: {sorted(m)}")
          def need(cond, msg):
              if not cond:
                  sys.exit(f"relink manifest: {msg}")
          def s(k):  # value must be a real str (not a number/bool that stringifies)
              return isinstance(m[k], str)
          need(type(m["schema_version"]) is int and m["schema_version"] == 2, "schema_version must be 2")
          # Identity binding: the manifest must echo the selected request id and exact
          # parent coordinates. In recovery mode those are the terminal failed build
          # named by the recovery run, never the new rebuild's coordinates.
          need(s("relink_request_id") and m["relink_request_id"] == os.environ["EXP_REQUEST_ID"], "relink_request_id != this build's request id")
          need(type(m["parent_run_id"]) is int and m["parent_run_id"] == int(os.environ["PARENT_RUN_ID"]), "parent_run_id != this build's run id")
          need(type(m["parent_run_attempt"]) is int and m["parent_run_attempt"] == int(os.environ["PARENT_RUN_ATTEMPT"]), "parent_run_attempt != this build's attempt")
          need(s("sefaria_tag") and m["sefaria_tag"] == os.environ["EXP_SEFARIA_TAG"], "sefaria_tag != this build's pinned tag")
          need(s("snapshot_zst_sha256") and m["snapshot_zst_sha256"] == os.environ["EXP_SNAPSHOT_SHA"], "snapshot_zst_sha256 != this build's snapshot")
          need(s("payload_sha256") and bool(re.fullmatch(r"[0-9a-f]{64}", m["payload_sha256"])), "payload_sha256 is not a sha256")
          need(s("linker_commit") and bool(re.fullmatch(r"[0-9a-f]{40}", m["linker_commit"])), "linker_commit is not a 40-hex sha")
          need(m["linker_commit"] == os.environ["RUN_HEAD_SHA"], "linker_commit != the relink run's head_sha")
          need(type(m["relink_run_id"]) is int and m["relink_run_id"] == int(os.environ["EXP_RUN_ID"]), "relink_run_id != the dispatched run")
          need(type(m["relink_run_attempt"]) is int and m["relink_run_attempt"] > 0, "relink_run_attempt not a positive int")
          need(m["relink_run_attempt"] == int(os.environ["RUN_ATTEMPT"]), "relink_run_attempt != the relink run's attempt")
          need(s("engine_fingerprint") and bool(re.fullmatch(r"[\x20-\x7e]{1,4096}", m["engine_fingerprint"])), "engine_fingerprint must be a non-empty single-line printable-ASCII string")
          print(f"LINKER_PAYLOAD_SHA256={m['payload_sha256']}")
          print(f"LINKER_ENGINE_FINGERPRINT={m['engine_fingerprint']}")
          print(f"LINKER_RELINK_RUN_ID={m['relink_run_id']}")
          print(f"LINKER_COMMIT={m['linker_commit']}")
          print(f"LINKER_RELINK_RUN_ATTEMPT={m['relink_run_attempt']}")
          PY
          tar --use-compress-program=unzstd -xf build/linker/linker_links.zst -C build/linker
          if [ "$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256" != "$SNAPSHOT_ZST_SHA256" ]; then
            # A recovery rebuild can differ bytewise only because the source importer
            # embeds textimages opportunistically. Compare all identities, context and
            # content against the exact original snapshot. The verifier allows only an
            # textimages URL/data-URI src substitutions on lines with zero Linker records.
            RECOVERY_COMPARE_DIR="$RUNNER_TEMP/relink-snapshot-compare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            rm -rf "$RECOVERY_COMPARE_DIR"
            mkdir -p "$RECOVERY_COMPARE_DIR"
            trap 'rm -rf "$RECOVERY_COMPARE_DIR"' EXIT
            ORIGINAL_SNAPSHOT_ZST="$RECOVERY_COMPARE_DIR/original.db.zst"
            ORIGINAL_SNAPSHOT_DB="$RECOVERY_COMPARE_DIR/original.db"
            REBUILT_SNAPSHOT_DB="$RECOVERY_COMPARE_DIR/rebuilt.db"
            gh release download \
              "lines-snapshot-sha256-$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256" \
              -R "$GITHUB_REPOSITORY" -p lines_snapshot.db.zst \
              -O "$ORIGINAL_SNAPSHOT_ZST"
            echo "$EXPECTED_LINKER_SNAPSHOT_ZST_SHA256  $ORIGINAL_SNAPSHOT_ZST" | sha256sum -c -
            unzstd -f "$ORIGINAL_SNAPSHOT_ZST" -o "$ORIGINAL_SNAPSHOT_DB"
            unzstd -f build/lines_snapshot.db.zst -o "$REBUILT_SNAPSHOT_DB"
            python3 .pipeline-control/.github/scripts/verify_relink_recovery_snapshot.py \
              --original "$ORIGINAL_SNAPSHOT_DB" \
              --rebuilt "$REBUILT_SNAPSHOT_DB" \
              --artifacts build/linker/artifacts \
              --payload-meta build/linker/meta.json \
              --baseline-manifest build/linker/line-baseline/manifest.json
            rm -rf "$RECOVERY_COMPARE_DIR"
            trap - EXIT
          fi
          "$GRADLE" :sefariasqlite:generateLinkerLinks \
            -PseforimDb=$PWD/build/seforim.db \
            -PlinkerArtifacts=$PWD/build/linker/artifacts \
            -PlinkerSidecar=$PWD/build/linker_sidecar.tsv \
            -PlinkerStrict=true \
            --no-daemon --stacktrace

      # ─── E1: ship the buildstate compressed ────────────────────────────────
      # seforim.db.buildstate is a ~990 MB SQLite file that every run uploads and
      # every NEXT run downloads ("Seed allocator from offset-1 release" — 128 s
      # in run 33865604251). It compresses ~2x, so publishing it as
      # seforim.db.buildstate.zst halves both.
      #
      # Level 10, measured on a real 615,899,136-byte buildstate (task2-runs/chg1)
      # with zstd 1.5.5 on 16 vCPU:
      #   L3  350,044,062  0.48 s   L9  313,173,328   5.32 s
      #   L6  329,090,836  1.57 s   L10 312,210,830   7.99 s
      #   L12 311,656,106 10.59 s   L15 311,053,197  12.62 s
      #   L19 292,368,510 27.74 s
      # L10 is the knee: L12/L15 buy ~0.2% for 30-60% more CPU, and L19's extra
      # 6.4% (~32 MB on the real file) costs ~+32 s of CRITICAL path here to save
      # ~15 s on an uplink that is idle anyway (it uploads in the background
      # from right after this step until publish).
      #
      # The worker count is byte-neutral, exactly as in the two other zstd steps:
      # -T1/-T4/-T16/-T0 at -10 all produced
      # e801ae3d6391653e3fb7f866a135d9d25f0303d6884db504e8863834b679cf69 on that
      # file, so this asset stays byte-deterministic for a given buildstate.
      #
      # Runs right after Phase-2 wrote this build's fresh stable link ids into
      # the buildstate (DiskBackedLinkIdAllocator), its last writer, so the bytes
      # are final; compress line text, VACUUM, QA and the fan never touch it.
      # The uncompressed file stays on disk. Nothing reads it after this step
      # any more, so it could be freed; it is kept because it is the local
      # artefact RELEASE.md and the publishRelease guard document. The ~600 MB
      # .zst now also sits on the tmpfs through compress line text and VACUUM
      # (~12 GiB there), still below the ~15.2 GiB generation-time peak.
      - name: Compress buildstate for the release (zstd)
        run: |
          set -euo pipefail
          . .pipeline-control/.github/scripts/zstd_workers.sh
          zstd -T"$(zstd_workers)" -10 -f \
            -o build/seforim.db.buildstate.zst build/seforim.db.buildstate
          ls -lh build/seforim.db.buildstate build/seforim.db.buildstate.zst

      # The .zst is final from here on, so its upload rides along compress line
      # text, VACUUM, QA and the fan; the publish step reaps it first thing.
      # Gated like the fan that used to start it: a first release is unchanged.
      - name: Start early buildstate upload (background)
        id: early_buildstate
        if: steps.discover.outputs.has_prev == 'true'
        env:
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          # The uploader creates the draft: mark it so any later failure deletes it.
          echo "DRAFT_RELEASE_CREATED=1" >> "$GITHUB_ENV"
          bash .pipeline-control/.github/scripts/upload_early_release_assets.sh \
            start buildstate build/seforim.db.buildstate.zst

      # ─── Compress line text (zstd + bundled dictionary) ───────────────────
      # One frame per line_content / version_line row. Runs after Phase-2, the
      # last reader of plain text, and before compaction reclaims the freed space.
      # Byte-deterministic for a given input regardless of -Pthreads. A
      # source_commit from before this step stays uncompressed; readers handle both.
      - name: Compress line text (zstd dictionary)
        run: |
          set -euo pipefail
          if ! grep -q 'register<JavaExec>("compressLineContent")' generator/common/build.gradle.kts; then
            echo "::notice::source_commit predates compressLineContent; the DB stays uncompressed"
            exit 0
          fi
          "$GRADLE" :generator-common:compressLineContent \
            -PdbPath=$PWD/build/seforim.db \
            --no-daemon --stacktrace

      # ─── Compact the finished DB ───────────────────────────────────────────
      # splitLineContent (schema 6) leaves the pages it freed on the freelist
      # (18% of the file on a 70-book subset). They are zeroed, so the .zst
      # hardly grows, but every user would install them. Runs after Phase-2 and
      # its ANALYZE, the last writers.
      # Disk: VACUUM INTO writes the compact copy (~one DB, ~7 GiB) to
      # $RUNNER_TEMP on the workspace disk (~850 GB free), then the original is
      # deleted before the copy moves back, so the 20 GiB tmpfs never holds two
      # DBs. A no-op when the freelist is empty.
      - name: Compact Seforim Database (VACUUM INTO)
        run: |
          set -euo pipefail
          ls -l build/seforim.db
          "$GRADLE" :generator-common:compactSeforimDb \
            -PdbPath=$PWD/build/seforim.db \
            -PscratchDir="$RUNNER_TEMP" \
            --no-daemon --stacktrace
          ls -l build/seforim.db

      # ─── QA gate on the full DB (§10) ──────────────────────────────────────
      # Runs after LINKER inject so the DB is complete. --require-all makes any
      # skipped check a hard failure (e.g. a missing metrics report), so a
      # release can never publish with §10.5 silently un-run. The metrics report
      # is emitted at the Sefaria stage; on the full DB check5 compares per-type
      # counts with ≥ semantics automatically (no --sefaria-stage — the DB has
      # also accumulated havrouta/otzaria/linker links by now).
      #
      # --expect-snapshot is not passed; the drift gate below holds the snapshots. The
      # manual-link counts are locked only by the manually dispatched manualLinksCorpusTest.
      # python3 (stdlib only) is the runtime; verify it like the deps script does
      # for sqlite3, then fail the job on any nonzero exit.
      - name: QA — run §10 checks on the full DB (required)
        env:
          # Reference-snapshot drift gate for the §10 checks (scripts/qa/common.py,
          # gate_snapshot_drift). Every check carrying a hard-coded baseline used
          # to PRINT the drift next to the observed value and PASS regardless, so
          # a slow bleed was visible only to a human reading the log. Now a shrink
          # larger than this percentage of the baseline is an ::error:: that fails
          # the build; anything smaller — and any growth — is a ::warning:: naming
          # the numbers.
          #
          # 2% is set against the widest drift the last good cycle (run
          # 34024655297) actually showed: baseProvenance=1 12970 vs 13056 =
          # −0.659%, dependenceType 4940 vs 4941 = −0.020%, book_base_text 5425 vs
          # 5426 = −0.018%. That is a 3x margin over the largest observed value,
          # so a normal weekly cannot trip it, while the −86-link bleed is at
          # least a warning now and a real collapse fails closed. Raising it is an
          # operator decision; refreshing a baseline is a deliberate edit to the
          # check, and --expect-snapshot still enforces the exact numbers.
          QA_DRIFT_MAX_SHRINK_PCT: "2"
          # A shrink is an error only when it also exceeds this absolute floor:
          # at 2% alone a -1 on guides=2 / midrash=5 / inferred pairs=20 /
          # targum=45 would fail the weekly release over one book that left
          # the export. 10 keeps that a warning; a real collapse still fails.
          QA_DRIFT_MIN_SHRINK_ABS: "10"
        run: |
          set -euo pipefail
          command -v python3
          python3 scripts/qa/run_all.py \
            --db build/seforim.db \
            --sefaria-dir "$SEFARIA_EXTRACT_ROOT" \
            --metrics build/seforim.db.link-import-metrics.json \
            --acronym-db generator/otzariasqlite/build/acronymizer/acronymizer.db \
            --require-all

      # ─── Schema fingerprint of the DB this build publishes ─────────────────
      # A few KB describing exactly the DB that ships as seforim.db.zst:
      # db_schema_version plus the physical column set of every table. It is
      # embedded in build_provenance.json below, so a FUTURE build can decide
      # whether this release works as a patch-fan anchor WITHOUT downloading
      # its 1.3 GB DB — and this build reads the same block out of older
      # releases for its own pre-check. Must run while build/seforim.db still
      # exists, i.e. before the fan and before the compress step.
      - name: Fingerprint published DB schema
        run: |
          set -euo pipefail
          python3 .pipeline-control/.github/scripts/patch_anchor_schema.py \
            dump build/seforim.db > build/db_schema.json
          echo "db_schema.json: $(wc -c < build/db_schema.json) bytes"

      # ─── One Gradle run so the fan below needs none ────────────────────────
      # The fan produces PATCH_FAN_PARALLELISM anchors at a time. Two concurrent
      # Gradle builds in one project directory cannot do that: they contend on
      # the project cache dir, on the configuration cache (this repo sets
      # org.gradle.configuration-cache=true) and on jvmJar's own output file,
      # which the other build's fork holds open while it reads it. So the fan
      # invokes PatchPipelineCli directly with `java`, and this step publishes
      # exactly what `gradle :generator-common:producePatchAndVerify` would have
      # forked — same main class, same -Xmx/GC args, same runtime classpath,
      # same toolchain version — read straight out of that task's definition.
      # Opportunistic, like the anchor prefetch: a payload commit older than the
      # patchPipelineLauncher task leaves no spec behind, and the fan falls back
      # to the unchanged serial Gradle invocation, one anchor at a time.
      - name: Materialise the patch-pipeline launcher
        if: steps.discover.outputs.has_prev == 'true'
        run: |
          set -euo pipefail
          LAUNCHER=generator/common/build/patch-pipeline-launcher.properties
          rm -f "$LAUNCHER"
          if "$GRADLE" :generator-common:patchPipelineLauncher --no-daemon --stacktrace \
             && [ -s "$LAUNCHER" ]; then
            echo "launcher spec (classpath elided):"
            grep -v '^classpath=' "$LAUNCHER"
          else
            echo "::warning::no :generator-common:patchPipelineLauncher in this payload commit — the patch fan falls back to one serial Gradle invocation per anchor"
            rm -f "$LAUNCHER"
          fi

      # ─── Produce log-fan of patches: offsets {1, 2, 4, 8, 16} ──────────────
      # The prev DB is reconstituted from the release's compressed seforim.db.zst.
      # Each anchor downloads + decompresses, runs the producer, then frees
      # everything so disk peak stays bounded; PATCH_FAN_PARALLELISM anchors
      # are in flight at once.
      - name: Produce + verify patch fan
        if: steps.discover.outputs.has_prev == 'true'
        env:
          # Patch compression level. At L22 zstd's job size exceeds a whole
          # patch (0.5–0.9 GB), so the in-JVM compressor runs on ONE core for
          # 5–7 minutes per anchor. L19 parallelises across all cores (seconds)
          # for a few percent larger .zst, and needs a smaller decompression
          # window on clients. Read by PatchPipelineCli (ZSTD_LEVEL); the full
          # DB's own `zstd -19` step below is unaffected.
          ZSTD_LEVEL: "19"
          # Operator knob: repository variable PATCH_FAN_PARALLELISM (default 2).
          # `|| '2'` matters: a bare `${{ vars.X }}` interpolates to '' when the
          # variable is unset, which the guard below would treat as junk.
          PATCH_FAN_PARALLELISM: ${{ vars.PATCH_FAN_PARALLELISM || '2' }}
          # The anchor downloads use the same preflighted credentials as publish.
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          # read_schema, produce_anchor, the heartbeat machinery and drain_batch are
          # sourced from one library so this body stays well under the 21,000-character
          # ceiling GitHub Actions puts on a single `run:` template — at 22,592 it
          # refused to load the whole workflow (run 34195296928). Sourced, not run: the
          # functions keep this shell, these `set` options and these globals, and
          # `produce_anchor` still forks from HERE when the driver backgrounds it.
          # From the pipeline-control checkout like every other helper in this job — the
          # payload checkout is a different commit.
          . .pipeline-control/.github/scripts/patch_fan_lib.sh
          THIS_VER=${{ steps.discover.outputs.db_version }}
          THIS_SCHEMA=$(read_schema build/seforim.db) || exit 1
          echo "THIS DB schema version = $THIS_SCHEMA"
          mkdir -p patches prev-dbs
          # A2: the buildstate upload started right after Phase-2 and may still
          # be in flight here; the publish step reaps it.
          # A1: the anchors were fetched in parallel while the DB was generated.
          PREFETCH_DIR=prefetch
          PREFETCH_WAIT_SECONDS=900

          # ── D: how many anchors are produced at once ────────────────────────
          # Run 33865604251 paid 284–382 s per anchor for work that is
          # single-threaded almost end to end (produce ~11–20 s, apply+verify
          # ~150 s, hash ~47 s, zstd L19 of the patch 20–60 s) on a 16-vCPU box:
          # four anchors were ~22 minutes of a mostly idle machine. Two at a
          # time fit the budget:
          #   RAM — 2 × (one -Xmx8g fork, whose real footprint is a small
          #     SQLite page cache plus row buffers, well under the ceiling, and
          #     ~1 GB of zstd L19 job buffers) on top of the ~9.5 GiB the tmpfs
          #     build/ pins (seforim.db 7.15 GiB + buildstate + snapshot) and
          #     the background buildstate upload, inside the ≥30 GiB this job
          #     demanded before it mounted that tmpfs.
          #   Disk — each concurrent anchor owns its extracted 7.15 GiB prev DB
          #     plus the verify copy the CLI makes from it, so ~31 GiB for two
          #     against ~880 GB free on the workspace disk.
          # PATCH_FAN_PARALLELISM=1 restores the strictly serial fan.
          FAN_PARALLELISM="${PATCH_FAN_PARALLELISM:-2}"
          case "$FAN_PARALLELISM" in
            ''|*[!0-9]*|0)
              echo "::warning::PATCH_FAN_PARALLELISM='$FAN_PARALLELISM' is not a positive integer — producing anchors one at a time"
              FAN_PARALLELISM=1
              ;;
          esac
          # The direct-`java` launcher published by "Materialise the
          # patch-pipeline launcher": main class, JVM args and runtime classpath
          # read out of the producePatchAndVerify task itself. Without a usable
          # one there is no way to run two producers at once (Gradle cannot be
          # invoked twice concurrently in this project dir), so the fan degrades
          # to exactly the serial Gradle loop it always ran.
          LAUNCHER=generator/common/build/patch-pipeline-launcher.properties
          PATCH_MAIN_CLASS=""
          PATCH_JVM_ARGS=""
          PATCH_CLASSPATH=""
          if [ -s "$LAUNCHER" ]; then
            PATCH_MAIN_CLASS=$(sed -n 's/^mainClass=//p' "$LAUNCHER")
            PATCH_JVM_ARGS=$(sed -n 's/^jvmArgs=//p' "$LAUNCHER")
            PATCH_CLASSPATH=$(sed -n 's/^classpath=//p' "$LAUNCHER")
            LAUNCHER_JAVA=$(sed -n 's/^javaVersion=//p' "$LAUNCHER")
            JAVA_MAJOR=$(java -XshowSettings:properties -version 2>&1 \
              | awk -F'= ' '/^[[:space:]]*java.specification.version = / {print $2; exit}')
            if [ -z "$PATCH_MAIN_CLASS" ] || [ -z "$PATCH_CLASSPATH" ] || [ "$JAVA_MAJOR" != "$LAUNCHER_JAVA" ]; then
              echo "::warning::patch-pipeline launcher unusable (mainClass='$PATCH_MAIN_CLASS', toolchain '$LAUNCHER_JAVA' vs java '$JAVA_MAJOR') — falling back to Gradle"
              PATCH_MAIN_CLASS=""
            fi
          fi
          if [ -z "$PATCH_MAIN_CLASS" ]; then
            echo "no usable patch-pipeline launcher — producing anchors serially through Gradle"
            FAN_PARALLELISM=1
          fi
          echo "patch fan parallelism: $FAN_PARALLELISM"

          ANCHORS="$RUNNER_TEMP/patch-fan-anchors.tsv"
          # One derivation of offset → tag, shared with the prefetch step.
          bash .pipeline-control/.github/scripts/patch_fan_anchors.sh \
            "$THIS_VER" prior-versions.tsv $PATCH_OFFSETS > "$ANCHORS"
          # Read the whole plan up front: the loop body runs the producer, which
          # must never be able to swallow the remaining rows from a redirected
          # stdin.
          mapfile -t ANCHOR_ROWS < "$ANCHORS"
          # Numbered progress: "anchor 3/4 …" tells an operator how much of the
          # fan is left without counting `starting anchor` lines by hand.
          ANCHOR_TOTAL=$(awk -F'\t' '$1 == "ANCHOR"' "$ANCHORS" | wc -l | tr -d ' ')
          ANCHOR_INDEX=0

          # Drive the anchors FAN_PARALLELISM at a time. Each batch's logs are
          # printed in offset order once the whole batch is done, so the step's
          # output stays readable and `anchor vNN timings:` keeps its shape and
          # its own line. A failing anchor does not kill its sibling: the batch
          # is drained, every log is printed, and only then does the step fail —
          # the same failure the serial loop produced, at most one concurrent
          # anchor's work later, and with no producer killed mid-write.
          BATCH_PIDS=()
          BATCH_LOGS=()
          BATCH_NAMES=()
          BATCH_TARGETS=()
          BATCH_STARTS=()
          FAN_FAILURE=0

          for ROW in ${ANCHOR_ROWS[@]+"${ANCHOR_ROWS[@]}"}; do
            IFS=$'\t' read -r STATUS OFFSET TARGET_VER TAG <<<"$ROW"
            case "$STATUS" in
              BELOW-ONE)
                echo "offset $OFFSET would target version $TARGET_VER (<1) — skip"
                continue
                ;;
              NO-RELEASE)
                echo "No prior release at db_version=$TARGET_VER (offset $OFFSET) — skip"
                continue
                ;;
            esac
            ANCHOR_LOG="$RUNNER_TEMP/patch-fan-anchor-$OFFSET.log"
            ANCHOR_INDEX=$((ANCHOR_INDEX + 1))
            ANCHOR_LABEL="anchor $ANCHOR_INDEX/$ANCHOR_TOTAL $TAG (offset $OFFSET, v${TARGET_VER} → v${THIS_VER})"
            echo "$ANCHOR_LABEL: starting; its log follows when this batch of $FAN_PARALLELISM finishes"
            # Concurrent forks are the one new pressure on this box's RAM;
            # leave the evidence in the log for the next tuning pass.
            awk '/MemAvailable/ {printf "MemAvailable: %.1f GiB\n", $2/1048576}' /proc/meminfo || true
            produce_anchor "$OFFSET" "$TARGET_VER" "$TAG" > "$ANCHOR_LOG" 2>&1 < /dev/null &
            BATCH_PIDS+=("$!")
            BATCH_LOGS+=("$ANCHOR_LOG")
            BATCH_NAMES+=("$ANCHOR_LABEL")
            BATCH_TARGETS+=("$TARGET_VER")
            BATCH_STARTS+=("$(date +%s)")
            if [ "${#BATCH_PIDS[@]}" -ge "$FAN_PARALLELISM" ]; then
              drain_batch || FAN_FAILURE=$?
              [ "$FAN_FAILURE" -eq 0 ] || break
            fi
          done
          if [ "$FAN_FAILURE" -eq 0 ]; then
            drain_batch || FAN_FAILURE=$?
          fi
          if [ "$FAN_FAILURE" -ne 0 ]; then
            echo "::error::patch fan: an anchor failed (exit $FAN_FAILURE) — see its log above"
            exit "$FAN_FAILURE"
          fi
          if [ -f "$PREFETCH_DIR/.log" ]; then
            echo "=== anchor prefetch log ==="
            cat "$PREFETCH_DIR/.log"
          fi
          echo "=== Final patch artefacts ==="
          ls -lh patches/ || true
          # Barriers are patch-*.db.zst too: a barrier-only fan is a publishable full-only release.
          announce_barriers
          # Skipped anchors are warnings. No delta AT ALL is only acceptable
          # when the size guard is what removed them: a corpus-wide churn build
          # legitimately ships full-only (seforim.db.zst + buildstate). Every
          # anchor skipped for any other reason is still a broken patch
          # contract and must fail loudly. SKIP_DIR is patch_fan_lib.sh's.
          if ! compgen -G "patches/patch-*.db.zst" > /dev/null; then
            OVERSIZED_SKIPS=$(find "$SKIP_DIR" -type f -name '*.oversized' | wc -l)
            STRUCTURAL_SKIPS=$(find "$SKIP_DIR" -type f -name '*.structural' | wc -l)
            if [ "$OVERSIZED_SKIPS" -gt 0 ]; then
              echo "::warning::patch fan produced no patch: $OVERSIZED_SKIPS anchor(s) dropped by the delta size guard, $STRUCTURAL_SKIPS structurally unpatchable — publishing a full-only release (seforim.db.zst + buildstate)"
              cat "$SKIP_DIR"/*.oversized
            else
              echo "::error::patch fan produced no patch although prior releases exist (every anchor skipped; $STRUCTURAL_SKIPS structurally unpatchable, none dropped by the size guard)"
              exit 1
            fi
          fi

      # Compress the full DB into a single .zst for the release. Done after the
      # delta phase so build/seforim.db (the diff ground-truth) and the .zst
      # don't both sit on disk during the patch fan.
      - name: Compress Seforim Database (zstd)
        run: |
          set -euo pipefail
          # `-22` was silently clamped to 19: levels above 19 require --ultra,
          # which this step never passed, so `-19` is BYTE-IDENTICAL to every
          # seforim.db.zst this pipeline has ever published — no level change
          # here, and no published digest moves.  The worker count is likewise
          # byte-neutral (see "Dump lines snapshot for the linker" above); it
          # only stops `-T0` from parking on 8 of the runner's 16 vCPUs.
          . .pipeline-control/.github/scripts/zstd_workers.sh
          # seforim.db.zst names a schema <= 5 DB forever (old updaters match it);
          # schema 6+ ships as seforim-schema<N>.db.zst. db_schema.json is this DB's dump.
          . .pipeline-control/.github/scripts/db_asset_names.sh
          FULL_DB_ASSET=$(full_db_asset_name "$(jq -er .db_schema_version build/db_schema.json)")
          zstd -T"$(zstd_workers)" -19 -f -o "build/$FULL_DB_ASSET" build/seforim.db
          echo "FULL_DB_ASSET=$FULL_DB_ASSET" >> "$GITHUB_ENV"

      # ─── Library stats (advisory) ──────────────────────────────────────────
      # One line of JSON — {"schema_version":1,"db_version":N,"books":…,
      # "links":…,"lines":…} — so a consumer (the website's stats banner) can
      # show the size of the library without downloading the 1.4 GB DB.
      #
      # It is written to build/ and copied by "Stage release assets" BEFORE the
      # provenance is computed, so it is an ordinary staged asset: listed with
      # its sha256 in build_provenance.json, uploaded by the same
      # draft → verify → publish loop (verify_remote demands remote == staged),
      # and the reuse scan's `provenance assets + 1` count still holds. An asset
      # uploaded to the release afterwards would break both of those.
      #
      # Advisory by design: the numbers are display-only, so no failure here may
      # cost the weekly release. sqlite3 missing, a failing query, or a result
      # that does not have the exact expected shape (or names a db_version other
      # than this build's) each emit a ::warning:: and leave NO file behind — the
      # release then ships exactly the asset set it shipped before this step.
      - name: Compute library stats (advisory)
        env:
          EXPECTED_DB_VERSION: ${{ steps.discover.outputs.db_version }}
        run: |
          set -uo pipefail
          OUT=build/library_stats.json
          rm -f "$OUT" "$OUT.tmp"
          skip() {
            echo "::warning::library stats: $1 — library_stats.json is not published on this release"
            rm -f "$OUT" "$OUT.tmp"
            exit 0
          }
          command -v sqlite3 >/dev/null 2>&1 || skip "sqlite3 not found"
          [ -s build/seforim.db ] || skip "build/seforim.db is missing"
          sqlite3 -init /dev/null -readonly -bail build/seforim.db "select json_object('schema_version',1,'db_version',(select cast(value as integer) from schema_meta where key='db_version'),'books',(select count(*) from book),'links',(select count(*) from link),'lines',(select count(*) from line));" \
            > "$OUT.tmp" || skip "the stats query failed"
          [[ "$EXPECTED_DB_VERSION" =~ ^[1-9][0-9]*$ ]] || skip "no db_version for this build"
          # Exact shape AND exact bytes: key order, integer counts > 0, compact
          # separators, one trailing LF — what sqlite3's json_object prints.
          python3 - "$OUT.tmp" "$EXPECTED_DB_VERSION" <<'PY' || skip "unexpected result $(head -c 300 "$OUT.tmp")"
          import json, sys
          raw = open(sys.argv[1], "rb").read()
          value = json.loads(raw)
          ok = (
              isinstance(value, dict)
              and list(value) == ["schema_version", "db_version", "books", "links", "lines"]
              and value["schema_version"] == 1
              and type(value["db_version"]) is int and value["db_version"] == int(sys.argv[2])
              and all(type(value[k]) is int and value[k] > 0 for k in ("books", "links", "lines"))
              and raw == json.dumps(value, separators=(",", ":")).encode() + b"\n"
          )
          sys.exit(0 if ok else 1)
          PY
          mv "$OUT.tmp" "$OUT" || skip "could not write $OUT"
          echo "library_stats.json: $(cat "$OUT")"

      # ─── Stage release assets ──────────────────────────────────────────────
      - name: Stage release assets
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
          PHASE2_IMPLEMENTATION_COMMIT: ${{ inputs.relink_recovery_run_id != '' && github.sha || inputs.source_commit }}
        run: |
          set -euo pipefail
          STAGE=release-staging
          mkdir -p "$STAGE"
          # Full DB, compressed — canonical source of the DB.
          # Future releases reconstitute the prev DB from this. Above 1.9 GiB it
          # is staged as parts + manifest (db_asset_names.sh: stage_full_db).
          . .pipeline-control/.github/scripts/db_asset_names.sh
          stage_full_db "build/$FULL_DB_ASSET" "$STAGE"
          # E1: the IdAllocator seed for the NEXT build, compressed (~2x).
          cp build/seforim.db.buildstate.zst "$STAGE/"
          # E2: lines_snapshot.db.zst is deliberately NOT staged. The identical
          # bytes are already published on the immutable, content-addressed
          # pre-release `lines-snapshot-sha256-<sha>` — which the relink-recovery
          # path in "Apply LINKER links (Phase-2)" already reads, and which
          # snapshot_release_tag / snapshot_zst_sha256 below name for every other
          # consumer (LinkerToOtzaria manual relink resolves it from there). A
          # second 830 MB - 1 GiB copy on this release bought nothing and cost
          # ~7 minutes of the ~2.1 MB/s uplink every week.
          # Patch fan (zero or more files; only present from release #2 on).
          if compgen -G "patches/patch-*.db.zst" > /dev/null; then
            cp patches/patch-*.db.zst "$STAGE/"
            cp patches/patch-*.db.zst.manifest.json "$STAGE/"
          fi
          # Advisory display stats — present only when "Compute library stats
          # (advisory)" produced a valid file; its absence never fails staging.
          if [ -s build/library_stats.json ]; then
            if ! cp build/library_stats.json "$STAGE/"; then
              echo "::warning::library stats: could not stage library_stats.json — omitting it from this release"
              rm -f "$STAGE/library_stats.json" || true
            fi
          fi
          echo "Staged assets:"
          ls -lh "$STAGE/"
          # Sanity: every asset must fit GitHub's 2 GiB per-asset cap.
          MAX=2147483647
          OVER=$(find "$STAGE" -maxdepth 1 -type f -size +${MAX}c)
          if [ -n "$OVER" ]; then
            echo "::error::Asset(s) exceed GitHub's 2 GiB single-file limit:"
            ls -lh $OVER
            exit 1
          fi

          # Canonical, timestamp-free provenance. Asset hashes cover every
          # payload file; build_provenance.json itself is covered by the
          # release verification and pipeline result to avoid a hash cycle.
          python3 - "$STAGE" "$MANUAL_LINKS_LINEAGE" build/db_schema.json <<'PY'
          import hashlib, json, os, pathlib, sys
          stage, lineage_path = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          lineage = json.loads(lineage_path.read_text(encoding="utf-8"))
          # Written by patch_anchor_schema.py dump — the same producer a later
          # build's anchor pre-check compares against, so the published block
          # and the compared block can never drift apart.
          db_schema = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding="utf-8"))
          def file_sha256(path):
              digest=hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024*1024),b""): digest.update(chunk)
              return digest.hexdigest()
          assets = []
          for path in sorted(stage.iterdir(), key=lambda p: p.name.encode()):
              assets.append({"name": path.name, "size": path.stat().st_size, "sha256": file_sha256(path)})
          # E2: this release no longer carries lines_snapshot.db.zst, so the
          # provenance names the immutable pre-release that does. The tag is
          # derived from the digest exactly as the publishing step derives it, and
          # the validator re-checks that derivation — a consumer can resolve the
          # snapshot from here and verify the bytes it downloads, fail-closed.
          # This is the snapshot the LINK SET on this release was produced from,
          # i.e. EXPECTED_LINKER_SNAPSHOT_ZST_SHA256, which the relink step
          # defaults to this build's own SNAPSHOT_ZST_SHA256 on every normal
          # path.  They diverge only in recovery mode, where this build's rebuild
          # is deliberately NOT published (nothing would ever read it) and the
          # earlier attempt's release still carries resolvable bytes — proven
          # line-for-line equivalent by the semantic compare in Phase-2.  Naming
          # the unpublished rebuild here would hand every consumer a 404.
          snapshot_sha256 = os.environ["EXPECTED_LINKER_SNAPSHOT_ZST_SHA256"]
          value = {
              "schema_version": 5,
              "snapshot_zst_sha256": snapshot_sha256,
              "snapshot_release_tag": "lines-snapshot-sha256-" + snapshot_sha256,
              "correlation_id": os.environ["CORRELATION_ID"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "sefaria_tag": os.environ["SEFARIA_TAG"],
              "sefaria_release_metadata_sha256": os.environ["SEFARIA_METADATA_SHA"],
              "sefaria_archive_sha256": os.environ["SEFARIA_ARCHIVE_SHA"],
              "otzaria_tag": os.environ["OTZARIA_TAG"],
              "otzaria_asset_sha256": os.environ["OTZARIA_ASSET_SHA"],
              "fordb_archive_sha256": os.environ["FORDB_ARCHIVE_SHA"],
              "fordb_tag": os.environ["FORDB_TAG"],
              "expected_links_commit": os.environ["EXPECTED_LINKS_COMMIT"],
              "otzaria_target_commit": os.environ["OTZARIA_TARGET_COMMIT"],
              "linker_payload_sha256": os.environ["LINKER_PAYLOAD_SHA256"],
              "linker_engine_fingerprint": os.environ["LINKER_ENGINE_FINGERPRINT"],
              "linker_relink_run_id": int(os.environ["LINKER_RELINK_RUN_ID"]),
              "linker_commit": os.environ["LINKER_COMMIT"],
              "linker_relink_run_attempt": int(os.environ["LINKER_RELINK_RUN_ATTEMPT"]),
              "linker_relink_request_id": os.environ["RELINK_REQUEST_ID"],
              "phase2_implementation_commit": os.environ["PHASE2_IMPLEMENTATION_COMMIT"],
              "lineage_sha256": hashlib.sha256(lineage_path.read_bytes()).hexdigest(),
              "config_sha256": lineage["config_sha256"],
              "source_links_tree_sha256": lineage["source_links_tree_sha256"],
              "packaged_links_tree_sha256": lineage["packaged_links_tree_sha256"],
              "db_schema": db_schema,
              "assets": assets,
          }
          (stage / "build_provenance.json").write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          python3 .pipeline-control/.github/scripts/validate_build_provenance.py "$STAGE/build_provenance.json"

      - name: Create draft, verify every uploaded asset, then publish
        id: publish
        env:
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          # 'success' exactly when the step that starts the early upload ran.
          EARLY_UPLOAD_STEP: ${{ steps.early_buildstate.outcome }}
        run: |
          set -euo pipefail
          # Reap the early buildstate upload before anything here touches the
          # draft, so no upload is in flight once this step talks to the release.
          if [ "$EARLY_UPLOAD_STEP" = success ]; then
            bash .pipeline-control/.github/scripts/upload_early_release_assets.sh \
              wait buildstate 3600
          fi
          # One implementation of create/adopt/reconcile/upload, shared with the
          # early upload that runs from right after Phase-2 — so the draft this
          # step adopts and the draft it created cannot drift.
          # It still never uses --clobber, still adopts a release only when its
          # identity is exactly this build's, and still fails closed otherwise.
          source .pipeline-control/.github/scripts/release_draft.sh
          use_token "$RELEASE_TOKEN_KIND" || {
            echo "::error::release credential preflight result is missing or invalid"
            exit 1
          }
          ensure_draft
          # Reached only when a draft for this tag exists; record it so a later
          # failure deletes it instead of leaving it behind.
          echo "DRAFT_RELEASE_CREATED=1" >> "$GITHUB_ENV"
          RELEASE_ID="$(resolve_release_id)" \
            || { echo "::error::Could not resolve the exact draft release id"; exit 1; }
          # Assets already uploaded early are re-verified here by name+size+digest
          # like every other asset; upload_asset skips only an exact match.
          # upload_asset prints one summary line per asset (uploaded/reused,
          # size, digest prefix, elapsed, MB/s) and release_upload_summary closes
          # the ~27-minute step with the totals, so a stall, a retry and a fast
          # upload are no longer the same silence.
          for asset_path in release-staging/*; do upload_asset "$asset_path"; done
          release_upload_summary
          verify_remote() {
            release_assets_json > "$RUNNER_TEMP/release-assets.json"
            python3 - "$RUNNER_TEMP/release-assets.json" release-staging <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          remote=json.loads(Path(sys.argv[1]).read_text())["assets"]
          actual={item["name"]:(item["size"],item.get("digest")) for item in remote}
          root=Path(sys.argv[2])
          def file_sha256(path):
              digest=hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024*1024),b""): digest.update(chunk)
              return digest.hexdigest()
          local={p.name:(p.stat().st_size,"sha256:"+file_sha256(p)) for p in root.iterdir() if p.is_file()}
          if actual!=local: raise SystemExit("remote release descriptors do not exactly match staged bytes")
          PY
          }
          verified=false
          for _ in $(seq 1 12); do
            if verify_remote; then verified=true; break; fi
            sleep 5  # asset digest metadata is briefly eventually consistent
          done
          [ "$verified" = true ] || { echo "::error::uploaded release descriptors never matched local bytes"; exit 1; }
          if ! gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"; then
            echo "::warning::Release publish failed with $CURRENT_TOKEN_KIND; retrying once before credential fallback."
            sleep 2
            if ! gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"; then
              echo "::warning::Release publish retry failed; using the other preflighted credential."
              switch_token
              gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/published-release.json"
          python3 - "$RUNNER_TEMP/published-release.json" "$RELEASE_TAG" "$SOURCE_COMMIT" "$PRERELEASE" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          expected_prerelease=sys.argv[4].lower()=="true"
          if not (
              value.get("tag_name")==sys.argv[2]
              and value.get("name")==sys.argv[2]
              and value.get("target_commitish")==sys.argv[3]
              and value.get("draft") is False
              and value.get("prerelease") is expected_prerelease
          ):
              raise SystemExit("published release identity does not exactly match this build")
          PY
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Write exact child result
        env:
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
        run: |
          set -euo pipefail
          mkdir -p pipeline-result
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          stage = pathlib.Path("release-staging")
          provenance_path = stage / "build_provenance.json"
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          def file_sha256(path):
              digest=hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024*1024),b""): digest.update(chunk)
              return digest.hexdigest()
          assets = []
          for path in sorted(stage.iterdir(), key=lambda item: item.name.encode("utf-8")):
              assets.append({"name": path.name, "size": path.stat().st_size, "sha256": file_sha256(path)})
          value = {
              "schema_version": 1,
              "status": "published",
              "correlation_id": os.environ["CORRELATION_ID"],
              "child_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "child_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_commit": os.environ["SOURCE_COMMIT"],
              "sefaria_tag": os.environ["SEFARIA_TAG"],
              "sefaria_release_metadata_sha256": os.environ["SEFARIA_METADATA_SHA"],
              "sefaria_archive_sha256": os.environ["SEFARIA_ARCHIVE_SHA"],
              "otzaria_tag": os.environ["OTZARIA_TAG"],
              "otzaria_asset_sha256": os.environ["OTZARIA_ASSET_SHA"],
              "fordb_archive_sha256": os.environ["FORDB_ARCHIVE_SHA"],
              "fordb_tag": os.environ["FORDB_TAG"],
              "expected_links_commit": os.environ["EXPECTED_LINKS_COMMIT"],
              "otzaria_target_commit": os.environ["OTZARIA_TARGET_COMMIT"],
              "release_tag": os.environ["RELEASE_TAG"],
              "build_provenance_sha256": hashlib.sha256(provenance_path.read_bytes()).hexdigest(),
              "lineage_sha256": provenance["lineage_sha256"],
              "config_sha256": provenance["config_sha256"],
              "source_links_tree_sha256": provenance["source_links_tree_sha256"],
              "packaged_links_tree_sha256": provenance["packaged_links_tree_sha256"],
              "assets": assets,
          }
          pathlib.Path("pipeline-result/pipeline-result.json").write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum pipeline-result/pipeline-result.json | cut -d' ' -f1 > pipeline-result/pipeline-result.sha256

      # Runs after the relink wait, which may pass the 24h lifetime of the job's
      # GITHUB_TOKEN, so it takes the preflighted release credential (the PAT when
      # it can write) exactly like the release steps, instead of the job default.
      - name: Publish exact child result release
        env:
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          set -euo pipefail
          source .pipeline-control/.github/scripts/release_draft.sh
          use_token "${RELEASE_TOKEN_KIND:-}" || {
            echo "::error::release credential preflight result is missing or invalid"
            exit 1
          }
          bash .pipeline-control/.github/scripts/publish_release_handoff.sh \
            "pipeline-result-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "Immutable Seforim pipeline result ${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            "$GITHUB_SHA" pipeline-result/pipeline-result.json pipeline-result/pipeline-result.sha256

      # Release the RAM tmpfs no matter how the job ended. By now assets are
      # already uploaded and staged on real disk, so discarding build/ is safe;
      # leaving the mount would pin ~GBs of RAM and trip the next run's sweep.
      - name: Release RAM-backed build dir (tmpfs)
        if: always()
        run: |
          BUILD="$GITHUB_WORKSPACE/build"
          if mountpoint -q "$BUILD"; then
            sudo umount "$BUILD" 2>/dev/null || sudo umount -l "$BUILD"
            echo "Unmounted tmpfs build dir; RAM released."
          else
            echo "No tmpfs mount to release."
          fi

      # The workspace persists between runs on this self-hosted runner and the next
      # run may be a week away — don't park multi-GB leftovers (release copies, prev
      # DBs from a mid-loop failure) on disk meanwhile. All of it is regenerated or
      # re-downloaded by the next run.
      - name: Clean run-scoped disk leftovers (workspace persists on self-hosted)
        if: always()
        run: |
          set -uo pipefail
          # The anchor prefetch and the early release upload deliberately outlive
          # their own steps; nothing may outlive the job. Both aborts verify the
          # recorded pid still belongs to that script before signalling, so a
          # reused pid on this long-lived runner is safe. ('snapshot' is gone
          # with E2 — the DB release no longer carries lines_snapshot.db.zst, so
          # 'buildstate' is the only early upload left.)
          # `|| true` used to swallow the abort's own failure too, so a
          # helper that never ran read exactly like a clean abort. Keep the job
          # green — this step is `if: always()` — but say which abort failed,
          # with what status, on top of the helper's own "what I aborted" line.
          abort_background() {  # <what> <command>...
            local what="$1" rc=0
            shift
            "$@" || rc=$?
            [ "$rc" -eq 0 ] || echo "::warning::$what: the abort helper itself exited $rc — the background job may still be running; nothing in this job waits for it"
          }
          abort_background "patch-fan anchor prefetch" \
            bash .pipeline-control/.github/scripts/prefetch_patch_anchors.sh abort prefetch
          abort_background "early release-asset upload 'buildstate'" \
            bash .pipeline-control/.github/scripts/upload_early_release_assets.sh abort buildstate
          rm -rf prev-dbs prev-meta patches release-staging prior-versions.tsv prefetch
          # prefetch/ is run-scoped and goes with the rest. The DURABLE anchor
          # cache it fed is NOT under the workspace, is bounded by the script
          # itself, and is deliberately kept: deleting it is what made run
          # 34024655297 re-download the 4 anchors run 34021998271 had already
          # fetched (~16 min). This step must never remove it — only report it.
          # Guarded like every other external call in this step: the default
          # shell is `bash -e`, so on a job that died before the pipeline-control
          # checkout an unguarded `bash <missing>` would exit 127 and turn this
          # `if: always()` cleanup red on top of the real failure.
          bash .pipeline-control/.github/scripts/prefetch_patch_anchors.sh cache-report || echo "patch-fan anchor cache: not reported (the prefetch helper is not in this workspace)"
          # $RUNNER_TEMP is NOT run-scoped on this self-hosted runner either, and
          # the two biggest temp trees are removed only by traps inside their own
          # steps — a job that dies elsewhere (or is cancelled) leaks them: the
          # raw lines snapshot is 5.8 GB and the manual-links input tree holds the
          # extracted Sefaria + Otzaria archives. Run 33991433362 left both.
          # Ours first, unconditionally, with sizes so the log shows the reclaim.
          for leftover in \
            "$RUNNER_TEMP/lines-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db" \
            "$RUNNER_TEMP/manual-links-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; do
            [ -e "$leftover" ] || continue
            echo "removing $(du -sh "$leftover" 2>/dev/null | cut -f1) $leftover"
            rm -rf "$leftover" || true
          done
          # Then a bounded sweep of the SAME two patterns from earlier runs. Heavy
          # phases are serialized by the host lease so nothing concurrent can own
          # these, but stay conservative anyway: depth 1, these two name shapes
          # only, and untouched for more than two days. This job's own
          # timeout-minutes is 4320, so no LIVE attempt of this workflow can own
          # a temp entry older than 72 h, while `-mtime +3` matches only entries at
          # least 96 h old (find truncates the age to whole days) — the window still
          # cannot race a live attempt, not even a directory whose mtime went stale
          # while its files were in use.
          # This step runs `if: always()`, and the default shell is `bash -e`, so
          # every reclaim is best-effort: one EACCES entry under $RUNNER_TEMP
          # must not turn a published, green build red.
          # The durable anchor cache is out of this sweep's reach twice over: it
          # lives under ${XDG_CACHE_HOME:-$HOME/.cache}/seforimlibrary, not under
          # $RUNNER_TEMP, and neither name shape below could match it. Keep both
          # true — a cache an unlucky +2 day gap could delete is not a cache, and
          # the ~16 min of re-download is exactly what it exists to prevent.
          find "$RUNNER_TEMP" -maxdepth 1 -mtime +3 \
            \( \( -type f -name 'lines-snapshot-*-*.db' \) -o \
               \( -type d -name 'manual-links-inputs-*-*' \) \) -print0 \
            | while IFS= read -r -d '' stale; do
                echo "removing stale $(du -sh "$stale" 2>/dev/null | cut -f1) $stale"
                rm -rf "$stale" || true
              done || true

      # The draft release can exist from right after Phase-2 onward (A2/E2 — the
      # early buildstate upload creates it), so a build that dies anywhere after
      # that would otherwise leave an unpublished draft holding this build's tag
      # and ~500 MB of assets. Delete it — only
      # ever a DRAFT whose identity is exactly this attempt's, so a published
      # release can never be touched — and never fail the job over it.
      - name: Delete this build's unpublished draft release on failure
        if: failure() || cancelled()
        env:
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -uo pipefail
          [ "${DRAFT_RELEASE_CREATED:-}" = 1 ] || {
            echo "this attempt never created a draft release — nothing to delete."
            exit 0
          }
          source .pipeline-control/.github/scripts/release_draft.sh
          use_token "${RELEASE_TOKEN_KIND:-}" || {
            echo "::warning::no preflighted release credential — leaving the draft for the operator"
            exit 0
          }
          # Drafts are invisible to /releases/tags/{tag}, so resolve through the
          # paginated collection. `.draft == true` is the whole safety property.
          # A draft created seconds before the failure can lag the listing: an
          # empty or failed listing is re-polled within the shared bound.
          listing="$RUNNER_TEMP/delete-draft-$$.json"
          release_id=""
          if list_matching_releases_settled "$listing"; then
            release_id=$(jq -er \
              --arg tag "$RELEASE_TAG" --arg target "$SOURCE_COMMIT" '
                select(length == 1) | .[0] |
                select(.tag_name == $tag and .name == $tag and
                       .target_commitish == $target and .draft == true) | .id |
                select(type == "number" and . > 0)
              ' "$listing") || release_id=""
          fi
          rm -f "$listing"
          if [ -z "$release_id" ]; then
            echo "no unpublished draft release for $RELEASE_TAG — nothing to delete."
            exit 0
          fi
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"; then
            echo "deleted the unpublished draft release $RELEASE_TAG ($release_id)."
          elif switch_token && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"; then
            echo "deleted the unpublished draft release $RELEASE_TAG ($release_id) after credential fallback."
          else
            echo "::warning::could not delete the draft release $RELEASE_TAG ($release_id); delete it manually."
          fi
          exit 0

      # The content-addressed `lines-snapshot-sha256-<sha>` pre-release is published
      # BEFORE the relink is dispatched, so an attempt that dies (or is cancelled) in
      # that window leaves a ~1 GiB pre-release nothing will ever download, and the
      # failure hooks above only ever looked at drafts. Delete it — but only when BOTH
      # hold: this attempt CREATED that release itself (the tag is content-addressed
      # and shared, so an attempt that merely rebuilt identical bytes must not claim
      # another's), and this attempt never reached the dispatch boundary (a relink in
      # flight, or a later recovery of it, resolves the snapshot of the attempt that
      # dispatched it — those must survive). Best-effort: never fails the job.
      - name: Delete this attempt's unconsumed snapshot pre-release on failure
        if: failure() || cancelled()
        env:
          AUTOMATIC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          RELINK_STEP_OUTCOME: ${{ steps.relink.outcome }}
        run: |
          set -uo pipefail
          TAG="${SNAPSHOT_RELEASE_TAG:-}"
          if [ "${SNAPSHOT_RELEASE_CREATED_HERE:-}" != 1 ] || [ -z "$TAG" ]; then
            echo "this attempt published no snapshot pre-release of its own — nothing to delete."
            exit 0
          fi
          if [ "${RELINK_DISPATCH_STARTED:-}" = 1 ]; then
            echo "$TAG was handed to the relink this attempt dispatched — keeping it for that run and any recovery of it."
            exit 0
          fi
          # RELINK_DISPATCH_STARTED reaches this step through GITHUB_ENV, which the
          # runner applies after the writing step COMPLETES. A relink step killed
          # mid-flight is the one case where "marker unset" is not proof that
          # `gh workflow run` never ran, and deleting a snapshot a live child is
          # about to download is unrecoverable. Leak instead.
          if [ "${RELINK_STEP_OUTCOME:-}" = cancelled ]; then
            echo "the relink step was cancelled, so an already-dispatched child cannot be ruled out — keeping $TAG."
            exit 0
          fi
          if ! [[ "$TAG" =~ ^lines-snapshot-sha256-[0-9a-f]{64}$ ]]; then
            echo "::warning::refusing to delete unexpected snapshot tag '$TAG'"
            exit 0
          fi
          source .pipeline-control/.github/scripts/release_draft.sh
          use_token "${RELEASE_TOKEN_KIND:-}" || {
            echo "::warning::no preflighted release credential — leaving $TAG for the operator"
            exit 0
          }
          delete_snapshot() {  # 0 = gone (deleted or already absent), 1 = try the other credential
            local err="$RUNNER_TEMP/snapshot-release-delete.err"
            if gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes 2> "$err"; then
              echo "deleted the unconsumed snapshot pre-release $TAG."
              return 0
            fi
            if grep -qi 'HTTP 404\|release not found' "$err"; then
              echo "$TAG is already gone — nothing to delete."
              return 0
            fi
            cat "$err" >&2
            return 1
          }
          if ! delete_snapshot; then
            if switch_token && delete_snapshot; then
              echo "(that deletion needed the fallback release credential)"
            else
              echo "::warning::could not delete the unconsumed snapshot pre-release $TAG; delete it manually."
            fi
          fi
          exit 0

      # If this build ends while the relink it dispatched is still pending/running — the
      # build hit its own timeout while waiting, failed in Phase-2, or was cancelled —
      # cancel OUR child so it can't outlive us as an orphan holding the linker
      # host/session (its own ceiling is 48h). Identity is the per-attempt request id
      # stamped into both run-names: matching is FULL-title equality, so this attempt's
      # cleanup can never touch another attempt's (or any other) runs. Order: cancel the
      # kaggle-relink DISPATCHER first and wait (bounded) until it is terminal — its own
      # SIGTERM trap cancels a child it already queued — then cancel any relink worker,
      # then re-scan a bounded window for a child that appeared mid-sweep. Anything still
      # invisible is reaped by the failure-event-driven reconcile-pipeline
      # invocation (keyed on the same request id).
      # Best-effort: never fails the job, and runs after the result artifact upload.
      - name: Cancel any in-flight relink for this build (no orphaned linker run)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          RECOVERY_RUN_ID: ${{ inputs.relink_recovery_run_id }}
        run: |
          set -uo pipefail
          # The identity vars exist only if the dispatch step ran (GITHUB_ENV) — before
          # that point there is nothing to clean. Two very different runs land here,
          # and the old single sentence claimed the wrong one for the recovery path:
          # a recovery reuses a relink that is already terminal, so it deliberately
          # dispatches nothing — it did not "fail to reach" the boundary.
          if [ "${RELINK_DISPATCH_STARTED:-}" != 1 ]; then
            if [ -n "${RECOVERY_RUN_ID:-}" ]; then
              echo "recovery mode (relink_recovery_run_id=$RECOVERY_RUN_ID): this attempt dispatches no relink of its own — no child of ours can be in flight."
            else
              echo "this attempt ended before the relink dispatch boundary (RELINK_DISPATCH_STARTED is unset) — no child was ever dispatched, so there is nothing to cancel."
            fi
            exit 0
          fi
          [ -n "${RELINK_REQUEST_ID:-}" ] || { echo "dispatch boundary lacked a request id — nothing to clean."; exit 0; }
          : "${RELINK_TITLE:=}"
          : "${KAGGLE_TITLE:=}"
          export RELINK_TITLE KAGGLE_TITLE
          # Fully paginated REST per pre-terminal status — an old orphan can never be
          # pushed out of a "last N runs" window by fresh completed runs. QUERY_OK
          # tracks every listing: a failed scan must end in ORPHAN_INTENT for the
          # reconciler, never in a false "cleanup done".
          QUERY_OK=1
          list_live() {  # $1 workflow file, $2 exact title → space-joined live run ids
            local wf="$1" status rows out="" failed=0
            for status in requested waiting pending queued in_progress; do
              if ! rows=$(TITLE="$2" gh api --paginate -X GET "repos/Otzaria/LinkerToOtzaria/actions/workflows/$wf/runs" \
                -f status="$status" -f per_page=100 \
                --jq '.workflow_runs[] | select(.display_title == env.TITLE) | (.id|tostring)' 2>/dev/null); then
                failed=1
                continue
              fi
              [ -z "$rows" ] || out+="$rows"$'\n'
            done
            printf '%s' "$out" | awk 'NF && !seen[$0]++' | tr '\n' ' '
            return "$failed"
          }
          wait_terminal() {  # $1 run id — bounded wait for the cancel to actually land
            local status
            for _ in $(seq 1 18); do
              status=$(gh api "repos/Otzaria/LinkerToOtzaria/actions/runs/$1" --jq .status 2>/dev/null || echo unknown)
              [ "$status" = "completed" ] && return 0
              sleep 5
            done
            echo "::warning::run $1 is still not terminal after 90s"
          }
          # Every run this step actually cancelled, so the closing line can report
          # what it cleaned instead of only that it ran.
          CANCELLED=""
          cancel_live() {  # $1 workflow, $2 exact title
            local ids rid
            if ! ids=$(list_live "$1" "$2"); then
              QUERY_OK=0
              ids=""
            fi
            for rid in $ids; do
              echo "Cancelling in-flight $1 run $rid ($2)"
              gh run cancel "$rid" -R Otzaria/LinkerToOtzaria || true
              wait_terminal "$rid"
              CANCELLED+="$1:$rid "
            done
          }
          scan_all() {
            local relink_ids="" kaggle_ids=""
            if ! relink_ids=$(list_live relink.yml "$RELINK_TITLE"); then QUERY_OK=0; relink_ids=""; fi
            if ! kaggle_ids=$(list_live kaggle-relink.yml "$KAGGLE_TITLE"); then QUERY_OK=0; kaggle_ids=""; fi
            LIVE="$relink_ids $kaggle_ids"
          }
          # Dispatcher first (it can spawn a child), waited to terminal; then the worker.
          cancel_live kaggle-relink.yml "$KAGGLE_TITLE"
          cancel_live relink.yml "$RELINK_TITLE"
          # Bounded re-scan: a dispatcher cancelled above may have created its child just
          # before dying, and the API lists new runs with a lag. Three short rounds.
          for _ in 1 2 3; do
            scan_all
            [ -z "${LIVE// /}" ] && break
            cancel_live kaggle-relink.yml "$KAGGLE_TITLE"
            cancel_live relink.yml "$RELINK_TITLE"
            sleep 10
          done
          scan_all
          if [ -n "${LIVE// /}" ]; then
            echo "::warning::ORPHAN_INTENT relink_request_id=$RELINK_REQUEST_ID runs='$LIVE' — cleanup could not terminate everything; the failure-event reconciler reaps by this request id."
          elif [ "$QUERY_OK" -ne 1 ]; then
            echo "::warning::ORPHAN_INTENT relink_request_id=$RELINK_REQUEST_ID query_ok=0 — one or more scans failed; a live run may be invisible. The failure-event reconciler reaps by this request id."
          else
            echo "relink orphan-cleanup done for request=$RELINK_REQUEST_ID: cancelled ${CANCELLED:-nothing (no child was still live)}."
          fi

      - name: Release cross-repo host lease after child cleanup
        if: always()
        run: |
          state="${HOST_LEASE_STATE:-$RUNNER_TEMP/host-lease.json}"
          if [ -f "$state" ]; then
            python3 .pipeline-control/.github/scripts/host_lease.py release --state "$state"
          else
            echo "No local host lease state."
          fi

  reuse-result:
    name: Return the already-published exact build
    needs: reconcile
    if: needs.reconcile.outputs.reuse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pipeline handoff publisher
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts
          persist-credentials: false
      - name: Write exact child result
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SEFARIA_TAG: ${{ inputs.sefaria_tag }}
          SEFARIA_METADATA_SHA: ${{ inputs.sefaria_release_metadata_sha256 }}
          SEFARIA_ARCHIVE_SHA: ${{ inputs.sefaria_archive_sha256 }}
          OTZARIA_TAG: ${{ inputs.otzaria_tag }}
          OTZARIA_ASSET_SHA: ${{ inputs.otzaria_asset_sha256 }}
          EXPECTED_LINKS_COMMIT: ${{ inputs.expected_links_commit }}
          OTZARIA_TARGET_COMMIT: ${{ inputs.otzaria_target_commit }}
          FORDB_ARCHIVE_SHA: ${{ inputs.fordb_archive_sha256 }}
          FORDB_TAG: ${{ inputs.fordb_tag }}
          RELEASE_TAG: ${{ needs.reconcile.outputs.release_tag }}
          BUILD_PROVENANCE_SHA: ${{ needs.reconcile.outputs.build_provenance_sha256 }}
          LINEAGE_SHA: ${{ needs.reconcile.outputs.lineage_sha256 }}
          CONFIG_SHA: ${{ needs.reconcile.outputs.config_sha256 }}
          SOURCE_TREE_SHA: ${{ needs.reconcile.outputs.source_links_tree_sha256 }}
          PACKAGED_TREE_SHA: ${{ needs.reconcile.outputs.packaged_links_tree_sha256 }}
          ASSETS_JSON: ${{ needs.reconcile.outputs.assets_json }}
        run: |
          set -euo pipefail
          mkdir -p pipeline-result
          python3 - <<'PY'
          import json, os, pathlib
          value = {
              "schema_version": 1,
              "status": "reused",
              "correlation_id": os.environ["CORRELATION_ID"],
              "child_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "child_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_commit": os.environ["SOURCE_COMMIT"],
              "sefaria_tag": os.environ["SEFARIA_TAG"],
              "sefaria_release_metadata_sha256": os.environ["SEFARIA_METADATA_SHA"],
              "sefaria_archive_sha256": os.environ["SEFARIA_ARCHIVE_SHA"],
              "otzaria_tag": os.environ["OTZARIA_TAG"],
              "otzaria_asset_sha256": os.environ["OTZARIA_ASSET_SHA"],
              "fordb_archive_sha256": os.environ["FORDB_ARCHIVE_SHA"],
              "fordb_tag": os.environ["FORDB_TAG"],
              "expected_links_commit": os.environ["EXPECTED_LINKS_COMMIT"],
              "otzaria_target_commit": os.environ["OTZARIA_TARGET_COMMIT"],
              "release_tag": os.environ["RELEASE_TAG"],
              "build_provenance_sha256": os.environ["BUILD_PROVENANCE_SHA"],
              "lineage_sha256": os.environ["LINEAGE_SHA"],
              "config_sha256": os.environ["CONFIG_SHA"],
              "source_links_tree_sha256": os.environ["SOURCE_TREE_SHA"],
              "packaged_links_tree_sha256": os.environ["PACKAGED_TREE_SHA"],
              "assets": json.loads(os.environ["ASSETS_JSON"]),
          }
          pathlib.Path("pipeline-result/pipeline-result.json").write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum pipeline-result/pipeline-result.json | cut -d' ' -f1 > pipeline-result/pipeline-result.sha256
      - name: Publish exact reused child result release
        run: >-
          bash .github/scripts/publish_release_handoff.sh
          "pipeline-result-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "Immutable reused Seforim pipeline result ${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          "$GITHUB_SHA" pipeline-result/pipeline-result.json pipeline-result/pipeline-result.sha256

  saga-callback:
    name: Notify event-driven parent after exact result release exists
    needs: [build-and-release, reuse-result]
    if: ${{ always() && inputs.saga_run_id != '' && (needs.build-and-release.result == 'success' || needs.reuse-result.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch zero-trust lookup key
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          SAGA_RUN_ID: ${{ inputs.saga_run_id }}
          SAGA_RUN_ATTEMPT: ${{ inputs.saga_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SAGA_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SAGA_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          payload="$(jq -cn --arg correlation_id "$CORRELATION_ID" \
            --argjson saga_run_id "$SAGA_RUN_ID" --argjson child_run_id "$GITHUB_RUN_ID" \
            --argjson saga_run_attempt "$SAGA_RUN_ATTEMPT" --argjson child_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{event_type:"seforim-published",client_payload:{correlation_id:$correlation_id,saga_run_id:$saga_run_id,saga_run_attempt:$saga_run_attempt,child_run_id:$child_run_id,child_run_attempt:$child_run_attempt}}')"
          # This is the event that wakes the downstream repo, and a repository
          # dispatch answers 204 with an empty body — so without these two lines a
          # swallowed dispatch and a good one leave the identical (empty) trace.
          # Everything printed is already public run metadata: no secret, and the
          # payload carries none.
          echo "dispatch: repos/Otzaria/otzaria-library event_type=seforim-published correlation_id=$CORRELATION_ID saga=$SAGA_RUN_ID:$SAGA_RUN_ATTEMPT child=$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          gh api repos/Otzaria/otzaria-library/dispatches --method POST --input - <<<"$payload"
          # The dispatch carries no run id back; the downstream run appears in
          # https://github.com/Otzaria/otzaria-library/actions filtered by this
          # correlation_id. Acceptance is what this line records.
          echo "dispatch accepted by repos/Otzaria/otzaria-library (204, empty body)"

  refresh-release-manifest:
    name: Refresh release-manifest.json after publish or verified reuse
    needs: [reconcile, build-and-release, reuse-result]
    if: >-
      always() && needs.reconcile.result == 'success' &&
      (needs.build-and-release.result == 'success' || needs.reuse-result.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: seforim-release-manifest-writer
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: otzaria
          fetch-depth: 0
          persist-credentials: false
      - name: Regenerate and push the release manifest
        run: |
          set -euo pipefail
          # `gh release view` with no tag asks for the LATEST release. A repo that
          # has never published one legitimately has no latest, and `latest: null`
          # is the correct manifest; an auth failure, a rate limit, a network drop
          # or a broken jq is NOT, and `2>/dev/null` collapsed all of them into
          # that same silent null while this step still reported success — i.e. it
          # published a manifest telling every client there is no release at all.
          # Keep stderr and separate "no release yet" from "the query failed".
          LATEST_ERR="$RUNNER_TEMP/gh-release-view.err"
          if LATEST_RAW=$(gh release view --json tagName,name,publishedAt,assets 2>"$LATEST_ERR"); then
            LATEST_JSON=$(jq -cS 'del(.assets[].downloadCount)' <<<"$LATEST_RAW")
            LATEST_ARG=(--argjson latest "$LATEST_JSON")
            echo "manifest: latest release $(jq -r .tagName <<<"$LATEST_JSON") published $(jq -r .publishedAt <<<"$LATEST_JSON")"
          elif grep -qEi 'release not found|404: not found \(https://api\.github\.com/repos/[^)]*/releases' "$LATEST_ERR"; then
            echo "manifest: no release published yet (gh reported 404) — writing latest: null"
            LATEST_ARG=(--argjson latest null)
          else
            echo "::error::gh release view failed for $GITHUB_REPOSITORY, refusing to publish a manifest that claims there is no release: $(tr '\n' ' ' < "$LATEST_ERR")"
            exit 1
          fi
          ALL_RELEASES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft|not) and (.prerelease|not)) | {tagName:.tag_name,name:.name,publishedAt:.published_at} | @json' \
            | jq -sc '.')
          # Derive the timestamp from immutable release state.  A verified reuse
          # must regenerate the same bytes instead of committing a wall-clock-only
          # change every time the parent pipeline is retried.
          GENERATED_AT=$(jq -r '[.[].publishedAt | select(. != null)] | max // "1970-01-01T00:00:00Z"' <<<"$ALL_RELEASES")
          jq -n \
            --arg generatedAt "$GENERATED_AT" \
            "${LATEST_ARG[@]}" \
            --argjson releases "$ALL_RELEASES" \
            '{generatedAt: $generatedAt, latest: $latest, releases: $releases}' \
            > release-manifest.json
          echo "manifest: $(jq '.releases | length' release-manifest.json) published releases, generatedAt=$GENERATED_AT, $(wc -c < release-manifest.json) bytes"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add release-manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "Update release manifest [skip ci]"
            git pull --rebase origin otzaria
            gh auth setup-git
            git push origin HEAD:otzaria
            echo "manifest: committed $(git rev-parse --short HEAD) and pushed to otzaria"
          else
            echo "manifest: unchanged at $(git rev-parse --short HEAD) — nothing to commit"
          fi
